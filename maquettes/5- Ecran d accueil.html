<title>LifeBook</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700;800&display=swap">
<style>
/* Layout : application mobile 480px max, en-tête « compte à rebours » vert citron sur fond nuit, résumé en tuiles, barre d'onglets en bas */
:root{
  --bg:#060806; --surface:#0f130e; --surface-2:#161c14; --line:#243020;
  --ink:#f3f6ee; --muted:#9ca594; --lived:#e9eee2; --empty:#1d261a;
  --lime:#c6f432; --lime-ink:#0b1004; --glow:rgba(198,244,50,.45);
  --late:#ff6161; --late-soft:#381617; --urgent:#ffb23d; --urgent-soft:#382810;
  --soon:#7fb2ff; --soon-soft:#15233a; --ok:#c6f432; --ok-soft:#232f0c;
  --display:"Sora", system-ui, sans-serif; --mono:"JetBrains Mono", ui-monospace, monospace;
  --r:18px; color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--display);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}
.app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(6,8,6,.85);backdrop-filter:blur(10px);
  padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line)}
.logo{font-weight:800;font-size:22px;letter-spacing:-.03em}.logo span{color:var(--lime)}
.avatar{width:40px;height:40px;border-radius:50%;border:1px solid var(--lime);background:none;color:var(--lime);font-weight:700;display:grid;place-items:center}
main{flex:1;padding-block:0 calc(96px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
main>.pad{height:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:600}
.row{display:flex;align-items:center;gap:8px}
.between{display:flex;align-items:center;justify-content:space-between;gap:8px}
.muted{color:var(--muted)} .small{font-size:13px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:10px 18px;min-height:46px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--lime);border-color:var(--lime);color:var(--lime-ink);box-shadow:0 0 22px rgba(198,244,50,.25)}
.btn.outline{background:none;border-color:var(--lime);color:var(--ink)}
.btn.sm{min-height:36px;padding:6px 14px;font-size:13px}
.btn.danger{color:var(--late);background:none}
.btn svg{width:16px;height:16px}
.iconbtn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface-2);display:grid;place-items:center;flex:none;font-size:18px}
input,select,textarea{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:44px;width:100%}
textarea{min-height:80px;resize:vertical}
input[type=range]{padding:0;min-height:32px;accent-color:var(--lime);background:none;border:none}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>span{font-size:12px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.empty{color:var(--muted);font-size:14px;margin:0;text-align:center;padding:10px 0}

/* En-tête compte à rebours */
.hero{position:relative;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));overflow:hidden;
  background:radial-gradient(120% 80% at 50% 0%,#1a2410 0%,#0b0f09 55%,var(--bg) 100%);border-bottom:1px solid var(--line);
  padding:28px max(16px,env(safe-area-inset-right,0px)) 26px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center}
.hero canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.hero>*:not(canvas){position:relative}
.hero .hello{font-size:13px;color:var(--muted)}
.hero .left{font-size:15px}
.hero .left b{font-family:var(--mono);color:var(--lime);font-size:18px}
.hero a.link{color:var(--ink);font-weight:600;font-size:17px;text-decoration:none;border-bottom:1px solid var(--ink);padding-bottom:2px;background:none;border-top:0;border-left:0;border-right:0}
.cd{display:grid;grid-template-columns:auto auto auto auto auto auto auto;align-items:start;justify-content:center;gap:2px 8px}
.cd b{font-family:var(--mono);font-weight:800;color:var(--lime);font-size:clamp(30px,10vw,46px);line-height:1;letter-spacing:-.02em;text-shadow:0 0 18px var(--glow);font-variant-numeric:tabular-nums}
.cd i{font-style:normal;font-family:var(--mono);color:var(--lime);opacity:.7;font-size:22px;line-height:1.5}
.cd span{grid-row:2;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.hero .acts{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

/* Résumé */
.sum{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:4px;text-align:left;min-width:0}
.tile .v{font-family:var(--mono);font-weight:700;font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.tile .v small{font-size:14px;color:var(--muted);font-weight:500}
.tile .k{font-size:12px;color:var(--ink);font-weight:600}
.tile .n{font-size:11px;color:var(--muted)}
.tile.wide{grid-column:1/-1}
.tile.lime .v{color:var(--lime)}
button.tile{cursor:pointer}
.meter{height:6px;background:var(--empty);border-radius:99px;overflow:hidden;margin-top:4px}.meter i{display:block;height:100%;background:var(--lime)}

/* Listes */
.item{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);min-width:0}
.item .t{flex:1;min-width:0;overflow-wrap:anywhere}
.item .t small{display:block;color:var(--muted);font-size:12px}
.item.done .t>span{text-decoration:line-through;color:var(--muted)}
.check{width:26px;height:26px;border-radius:8px;border:2px solid var(--muted);background:none;flex:none;display:grid;place-items:center;padding:0;font-weight:800}
.check[aria-pressed="true"]{background:var(--lime);border-color:var(--lime);color:var(--lime-ink)}
.time{font-family:var(--mono);font-size:13px;color:var(--lime);min-width:44px}
.x{border:none;background:none;color:var(--muted);width:36px;height:36px;flex:none;border-radius:50%}
.star{border:none;background:none;width:36px;height:36px;flex:none;color:var(--muted);font-size:18px}
.star[aria-pressed="true"]{color:var(--urgent)}
.list{display:flex;flex-direction:column;gap:8px}
.st{font-weight:600;font-size:11px;padding:3px 9px;border-radius:99px;white-space:nowrap}
.st.late{background:var(--late-soft);color:var(--late)}.st.urgent{background:var(--urgent-soft);color:var(--urgent)}
.st.soon{background:var(--soon-soft);color:var(--soon)}.st.ok{background:var(--ok-soft);color:var(--ok)}.st.done{background:var(--surface-2);color:var(--muted)}
.chip{font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.ex{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--soon);border:1px dashed var(--soon);border-radius:4px;padding:0 5px}
.pagehead{padding-top:16px;display:flex;flex-direction:column;gap:4px}
.pagehead h1{font-size:24px;font-weight:800;letter-spacing:-.03em}
.pagehead h1 span{color:var(--lime)}
.navdate{display:flex;align-items:center;justify-content:space-between;gap:8px}
.navdate h2{font-size:16px;text-align:center;flex:1}
.day{display:flex;gap:12px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--surface);width:100%;text-align:left}
.day.today{border-color:var(--lime)}
.day .d{width:46px;flex:none;text-align:center}
.day .d b{display:block;font-family:var(--mono);font-size:22px}
.day .d span{font-size:11px;color:var(--muted);text-transform:uppercase}
.day .c{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.day .c div{font-size:13px;overflow-wrap:anywhere}
.mini{height:4px;background:var(--empty);border-radius:99px;overflow:hidden;margin-top:4px}.mini i{display:block;height:100%;background:var(--lime)}
.bar{height:8px;background:var(--empty);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--lime)}
.goal{border:1px solid var(--line);border-left:4px solid var(--ok);border-radius:14px;background:var(--surface);padding:14px;display:flex;flex-direction:column;gap:10px}
.goal.late{border-left-color:var(--late)}.goal.urgent{border-left-color:var(--urgent)}.goal.soon{border-left-color:var(--soon)}.goal.done{opacity:.6;border-left-color:var(--line)}
.goal h3{font-size:16px;overflow-wrap:anywhere}
.prog{height:5px;background:var(--empty);border-radius:99px;overflow:hidden}.prog i{display:block;height:100%;background:var(--lime)}
.moods{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.moods button{min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);font-family:var(--mono);font-weight:700}
.moods button[aria-pressed="true"]{background:var(--lime);color:var(--lime-ink);border-color:var(--lime)}
details.box{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:14px 16px}
details.box>summary{cursor:pointer;font-weight:700;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:8px}
details.box>summary::after{content:"+";font-family:var(--mono);color:var(--lime);font-size:20px}
details.box[open]>summary::after{content:"–"}
details.box[open]>summary{margin-bottom:12px}
.past{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--surface);width:100%;text-align:left}
.past .t{flex:1;min-width:0}
.past .t small{display:block;color:var(--muted);font-size:12px;overflow-wrap:anywhere}
.ring{width:46px;height:46px;flex:none;border-radius:50%;display:grid;place-items:center;font-family:var(--mono);font-size:12px;font-weight:700}
canvas#lifeCanvas{display:block;width:100%}

/* Onglets */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(15,19,14,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs div{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(6,minmax(0,1fr))}
nav.tabs button{border:none;background:none;min-height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--muted);padding:0 2px;text-align:center;line-height:1.15}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--lime)}
.sheet{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.65);display:flex;align-items:flex-end;justify-content:center}
.sheet>div{width:100%;max-width:480px;background:var(--surface);border-radius:22px 22px 0 0;border-top:1px solid var(--lime);
  padding:20px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px;max-height:90vh;overflow:auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--lime);color:var(--lime-ink);padding:8px 16px;border-radius:99px;font-size:13px;font-weight:700}
.quote{font-family:var(--mono);font-size:12px;color:var(--muted);text-align:center;margin:0}

/* Mois et année */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .h{font-size:10.5px;color:var(--muted);text-align:center;text-transform:uppercase;font-weight:600;padding-bottom:4px}
.mday{aspect-ratio:1/1.1;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:6px 2px;min-width:0}
.mday b{font-family:var(--mono);font-size:14px}
.mday .dots{display:flex;gap:2px;min-height:6px}
.mday .dots i{width:5px;height:5px;border-radius:50%;background:var(--lime)}
.mday .dots i.d{background:var(--muted)}
.mday .dots i.g{background:var(--urgent)}
.mday.out{visibility:hidden}
.mday.pastd{opacity:.5}
.mday.today{border-color:var(--lime);box-shadow:0 0 12px rgba(198,244,50,.35)}
.mday.today b{color:var(--lime)}
.wk52{display:grid;grid-template-columns:repeat(13,minmax(0,1fr));gap:4px}
.wk52 i{aspect-ratio:1;border-radius:4px;background:var(--empty);position:relative}
.wk52 i.p{background:var(--lived)}
.wk52 i.n{background:var(--lime);box-shadow:0 0 10px var(--lime)}
.wk52 i.g::after{content:"";position:absolute;inset:-2px;border-radius:5px;border:2px solid var(--urgent)}
.months{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.mcard{min-height:92px;border-radius:16px;border:1px solid var(--line);background:var(--surface);padding:10px;display:flex;flex-direction:column;gap:4px;text-align:left}
.mcard b{font-size:14px;text-transform:capitalize}
.mcard small{font-size:11px;color:var(--muted)}
.mcard.cur{border-color:var(--lime)}
.mcard.cur b{color:var(--lime)}
.mcard.pastm{opacity:.6}
.stats3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stats3 div{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px}
.stats3 b{display:block;font-family:var(--mono);font-size:22px}
.stats3 small{font-size:11px;color:var(--muted)}
.stats3 .lime b{color:var(--lime);text-shadow:0 0 14px rgba(198,244,50,.35)}
.legend2{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:11px;color:var(--muted)}
.legend2 span{display:inline-flex;align-items:center;gap:5px}
.legend2 i{width:9px;height:9px;border-radius:3px;display:inline-block}
.linkcard{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);width:100%;text-align:left}
.linkcard svg{width:22px;height:22px;color:var(--lime);flex:none}
.linkcard .t{flex:1;min-width:0}
.linkcard small{display:block;color:var(--muted);font-size:12px}

/* Carte « Maintenant » */
.hero.compact{gap:12px;padding-top:20px;padding-bottom:20px}
.iconbtn.sumbtn{width:40px;height:40px;border-color:var(--lime);color:var(--lime);background:none}
.iconbtn.sumbtn svg{width:20px;height:20px}
.nowcard{position:relative;border-radius:24px;border:1px solid var(--line);background:radial-gradient(90% 70% at 50% 30%,rgba(198,244,50,.10) 0%,var(--surface) 60%);padding:22px 16px 18px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;overflow:hidden;--ring:var(--lime);--ringglow:rgba(198,244,50,.45)}
.nowcard.urgent{--ring:var(--urgent);--ringglow:rgba(255,178,61,.5);background:radial-gradient(90% 70% at 50% 30%,rgba(255,178,61,.12) 0%,var(--surface) 60%)}
.nowcard.late{--ring:var(--late);--ringglow:rgba(255,97,97,.5);border-color:rgba(255,97,97,.45);background:radial-gradient(90% 70% at 50% 30%,rgba(255,97,97,.14) 0%,var(--surface) 60%)}
.nowcard.calm{--ringglow:rgba(198,244,50,.25)}
.nowcard .tag{font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.14em;color:var(--ring);display:flex;align-items:center;gap:8px}
.nowcard .tag i{width:8px;height:8px;border-radius:50%;background:var(--ring);box-shadow:0 0 10px var(--ring);animation:blink 1.1s ease-in-out infinite}
.ringwrap{position:relative;width:min(72vw,264px);aspect-ratio:1;display:grid;place-items:center}
.ringwrap::before{content:"";position:absolute;inset:12%;border-radius:50%;background:radial-gradient(circle,var(--ringglow) 0%,transparent 70%);animation:pulse 2s ease-in-out infinite}
.ringwrap svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.ringwrap .spin{transform-origin:110px 110px;animation:spin 9s linear infinite}
.nowcard.late .ringwrap .spin,.nowcard.urgent .ringwrap .spin{animation-duration:3.5s}
.ringwrap .inner{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:0 18%}
.ringwrap .inner small{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.ringwrap .inner b{font-family:var(--mono);font-weight:800;font-size:clamp(28px,9vw,38px);color:var(--ring);text-shadow:0 0 16px var(--ringglow);font-variant-numeric:tabular-nums;line-height:1}
.ringwrap .inner span{font-size:12px;color:var(--muted)}
.nowcard .say{font-size:21px;font-weight:800;letter-spacing:-.02em;line-height:1.25;max-width:22ch;text-wrap:balance}
.nowcard .say em{font-style:normal;color:var(--ring)}
.nowcard .when{font-family:var(--mono);font-size:12px;color:var(--muted)}
.nowcard .acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.nowcard .acts .btn{min-height:52px}
.nowcard .more{font-size:12px;color:var(--muted)}
.nowcard .more b{color:var(--late)}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{transform:scale(.92);opacity:.7}50%{transform:scale(1.06);opacity:1}}
@keyframes blink{0%,100%{opacity:.35}50%{opacity:1}}
.plan{display:flex;flex-direction:column;gap:6px}
.plan .item.cur{border-color:var(--lime)}
.plan .item.cur .time{font-weight:700}
.laters{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.laters .btn{min-height:52px}

/* Chronologie de vie */
.tline{width:100%;max-width:340px;display:flex;flex-direction:column;gap:6px}
.tl-top{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;color:var(--muted)}
.tl-top b{font-family:var(--mono);font-size:13px;color:var(--lived);font-weight:700}
.tl-top b.lime{color:var(--lime);text-shadow:0 0 10px var(--glow)}
.tl-bar{position:relative;height:8px;border-radius:99px;background:var(--empty);display:flex;overflow:visible}
.tl-bar i{display:block;height:100%}
.tl-bar .u{background:linear-gradient(90deg,#9ca594,#f3f6ee);border-radius:99px 0 0 99px;transform-origin:left;animation:grow-x 1.3s cubic-bezier(.2,.8,.2,1) both}
.tl-bar .l{flex:1;border-radius:0 99px 99px 0;background:linear-gradient(90deg,var(--lime),rgba(198,244,50,.35),var(--lime));background-size:200% 100%;animation:shimmer 3s linear infinite;box-shadow:0 0 10px var(--glow)}
.tl-bar .mk{position:absolute;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:var(--lime);border:2px solid var(--bg);box-shadow:0 0 12px var(--lime);animation:beat 1.6s ease-in-out infinite}
.tl-ax{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;color:var(--muted)}
@keyframes grow-x{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes shimmer{to{background-position:-200% 0}}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.2)}30%{transform:scale(1)}45%{transform:scale(1.12)}}
/* Recommandation urgente */
.reco{position:relative;display:flex;align-items:center;gap:10px;width:100%;max-width:340px;padding:8px 10px 8px 12px;border-radius:14px;border:1px solid var(--urgent);background:rgba(255,178,61,.08);text-align:left;color:var(--ink);animation:alarm 2s ease-in-out infinite}
.reco svg{width:20px;height:20px;color:var(--urgent);flex:none;animation:beat 1.4s ease-in-out infinite}
.reco .t{flex:1;min-width:0;font-size:12.5px;line-height:1.35;font-weight:600}
.reco .t em{font-style:normal;color:var(--urgent)}
.reco .t small{display:block;color:var(--muted);font-size:10.5px;font-weight:500;margin-top:2px}
.reco .why{transition:opacity .4s}
.reco .why.fade{opacity:0}
.reco .go{font-family:var(--mono);color:var(--urgent);font-size:16px}
@keyframes alarm{0%,100%{box-shadow:0 0 0 0 rgba(255,178,61,.0),0 0 10px rgba(255,178,61,.15)}50%{box-shadow:0 0 0 4px rgba(255,178,61,.12),0 0 22px rgba(255,178,61,.35)}}
.sug{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;border:1px solid var(--line);background:var(--surface-2)}
.sug .t{flex:1;min-width:0}
.sug .t small{display:block;color:var(--muted);font-size:12px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="app">
  <header class="top">
    <div class="logo">Life<span>Book</span></div>
    <div class="row"><span class="small muted" id="saveState"></span><button class="iconbtn sumbtn" id="openSum" type="button" aria-label="Mon résumé" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 20V11M12 20V5M19 20v-6"/></svg></button><button class="avatar" id="openProfile" type="button" aria-label="Mon compte">?</button></div>
  </header>
  <main id="view"></main>
</div>
<nav class="tabs" aria-label="Navigation"><div id="tabs"></div></nav>
<div id="sheetRoot"></div>

<script>
(function(){
  const DAY=864e5, WEEK=7*DAY;
  const $=(id)=>document.getElementById(id);
  const esc=(s)=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const uid=()=>Math.random().toString(36).slice(2,10);
  const pad=(n)=>String(n).padStart(2,'0');
  const iso=(d)=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
  const parse=(s)=>new Date(s+'T12:00:00');
  const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
  const today=()=>iso(new Date());
  const monday=(s)=>{const d=parse(s);const w=(d.getDay()+6)%7;d.setDate(d.getDate()-w);return iso(d)};
  const fmt=(s,o)=>parse(s).toLocaleDateString('fr-FR',o||{weekday:'long',day:'numeric',month:'long'});
  const fmtN=(n)=>Math.max(0,Math.round(n)).toLocaleString('fr-FR').replace(/[\u202f\u00a0]/g,'\u00a0');
  const cap=(s)=>s.charAt(0).toUpperCase()+s.slice(1);
  const toMin=(t)=>{const a=String(t||'00:00').split(':').map(Number);return a[0]*60+(a[1]||0)};
  const toT=(m)=>pad(Math.floor(m/60)%24)+':'+pad(m%60);
  const endOf=(x)=>x.end&&toMin(x.end)>toMin(x.time)?toMin(x.end):toMin(x.time)+60;
  const hms=(sec)=>{sec=Math.max(0,Math.floor(sec));const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return (h?pad(h)+':':'')+pad(m)+':'+pad(s)};

  const ICONS={
    home:'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
    week:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
    day:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
    past:'<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/>',
    life:'<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 7h2M12 7h2M16 7h0M8 11h2M12 11h2M8 15h2"/>',
    month:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4M7 14h2M11 14h2M15 14h2M7 17h2M11 17h2"/>',
    year:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
    arrow:'<path d="M7 17L17 7M8 7h9v9"/>',
    pen:'<path d="M4 20h4L19 9l-4-4L4 16z"/>'
  };
  const svg=(k)=>'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+ICONS[k]+'</svg>';
  const TABS=[['home','Accueil'],['day','Journée'],['week','Semaine'],['month','Mois'],['year','Année'],['life','Ma vie']];

  let S={profile:null,goals:[],tasks:[],focus:{},reports:[],health:null};
  let tab='home', dayCur=today(), weekCur=monday(today()), pastMode='jours';
  let monthCur=today().slice(0,7), yearCur=new Date().getFullYear();
  let store=null, saveTimer=null;

  /* ---------- Calculs ---------- */
  function prof(){ return Object.assign({name:'',birth:'1996-06-15',exp:80,sleep:8,work:40,retire:60}, S.profile||{}); }
  function life(){
    const p=prof(); const birth=new Date(p.birth+'T00:00:00');
    const end=new Date(birth); end.setFullYear(birth.getFullYear()+Number(p.exp));
    const ret=new Date(birth); ret.setFullYear(birth.getFullYear()+Number(p.retire));
    const now=new Date(); const total=Number(p.exp)*52;
    const lived=Math.min(total,Math.max(0,Math.floor((now-birth)/WEEK)));
    const left=Math.max(0,total-lived);
    const sleepW=left*Number(p.sleep)/24;
    const workCal=Math.max(0,(ret-now)/WEEK);
    const workW=workCal*Number(p.work)/168;
    let age=now.getFullYear()-birth.getFullYear(); const bd=new Date(birth); bd.setFullYear(now.getFullYear()); if(now<bd) age--;
    return {birth,end,total,lived,left,age,sleepW,workW,workCal,freeW:Math.max(0,left-sleepW-workW)};
  }
  function weeksTo(d){return Math.ceil((new Date(d+'T23:59:59')-Date.now())/WEEK)}
  function status(g){
    if(g.done) return {k:'done',t:'Atteint',w:9e9};
    const w=weeksTo(g.deadline);
    if(w<=0) return {k:'late',t:w===0?'Cette semaine':'En retard',w};
    if(w<=2) return {k:'urgent',t:'Urgent · '+w+' sem.',w};
    if(w<=8) return {k:'soon',t:'Reste '+w+' sem.',w};
    return {k:'ok',t:'Reste '+w+' sem.',w};
  }
  const tasksOn=(d)=>S.tasks.filter(t=>t.date===d).sort((a,b)=>(b.prio-a.prio)||(a.time||'99').localeCompare(b.time||'99'));

  /* ---------- Rendu ---------- */
  function renderTabs(){
    $('tabs').innerHTML=TABS.map(([k,l])=>'<button type="button" data-tab="'+k+'"'+(tab===k?' aria-current="page"':'')+'>'+svg(k)+'<span>'+l+'</span></button>').join('');
  }
  function render(){
    renderTabs(); stopParticles();
    const p=S.profile; $('openProfile').textContent=p&&p.name?p.name.charAt(0).toUpperCase():'?'; $('openSum').hidden=!p; nowKey='';
    const v=$('view');
    if(!S.profile){ v.innerHTML=viewOnboard(); bindOnboard(); startParticles(); return; }
    v.innerHTML=({home:viewHome,week:viewWeek,day:viewDay,month:viewMonth,year:viewYear,past:viewPast,life:viewLife})[tab]();
    if(tab==='home'){ tick(); startParticles(); }
    if(tab==='life') drawGrid();
  }

  function heroCD(){
    return '<div class="cd" aria-label="Compte à rebours de ta vie">'
      +'<b id="tD">0</b><i>:</i><b id="tH">00</b><i>:</i><b id="tM">00</b><i>:</i><b id="tS">00</b>'
      +'<span>jours</span><span></span><span>heures</span><span></span><span>min</span><span></span><span>sec</span></div>';
  }

  /* ---------- Onboarding ---------- */
  function viewOnboard(){
    return '<section class="hero"><canvas id="pc" aria-hidden="true"></canvas>'
      +'<div class="label" style="color:var(--lime)">Bienvenue</div><h1 style="font-size:30px;font-weight:800;letter-spacing:-.03em">Ta vie tient sur une seule page</h1>'
      +'<p class="muted" style="margin:0;max-width:34ch">Environ 4 160 semaines pour 80 ans. LifeBook t\'aide à planifier tes semaines, tes journées et tes rêves.</p></section>'
      +'<form id="createForm" class="card">'
      +'<label class="field"><span>Prénom</span><input id="cName" required maxlength="40" autocomplete="given-name"></label>'
      +'<label class="field"><span>Date de naissance</span><input id="cBirth" type="date" required value="1996-06-15"></label>'
      +'<label class="field"><span>Espérance de vie (ans)</span><input id="cExp" type="number" min="40" max="120" value="80" required></label>'
      +'<div class="item"><div class="t"><span class="mono" id="cPrev" style="color:var(--lime);font-size:22px;font-weight:700">—</span><small>semaines devant toi</small></div></div>'
      +'<button class="btn primary" type="submit">Commencer '+svg('arrow')+'</button></form>'
      +'<p class="quote">« Ce n\'est pas que nous ayons peu de temps, c\'est que nous en perdons beaucoup. » Sénèque</p>';
  }
  function bindOnboard(){
    const upd=()=>{ const b=$('cBirth').value, e=Number($('cExp').value)||80; if(!b) return;
      $('cPrev').textContent=fmtN(e*52-Math.floor((Date.now()-new Date(b+'T00:00:00'))/WEEK)); };
    $('cBirth').addEventListener('input',upd); $('cExp').addEventListener('input',upd); upd();
  }

  /* ---------- Accueil ---------- */
  function viewHome(){
    const L=life(), p=prof(), t=today();
    const tt=tasksOn(t).slice().sort((a,b)=>(a.time||'99').localeCompare(b.time||'99')); const done=tt.filter(x=>x.done).length;
    const urg=S.goals.filter(g=>!g.done).map(g=>({g,s:status(g)})).filter(o=>['late','urgent','soon'].includes(o.s.k)).sort((a,b)=>a.s.w-b.s.w);
    const nm=new Date().getHours()*60+new Date().getMinutes();
    let o='<section class="hero compact"><canvas id="pc" aria-hidden="true"></canvas>'
      +'<div class="hello">Bonjour '+esc(p.name)+' · '+cap(fmt(t))+'</div>'
      +heroCD()
      +'<div class="left">Il te reste <b>'+fmtN(L.left)+'</b> semaines</div>'
      +lifeBars(L)
      +recoBtn()+'</section>';
    o+='<section class="nowcard" id="nowCard" aria-live="polite"></section>';
    o+='<div class="card"><div class="between"><div class="label">Programme du jour</div><span class="small mono muted">'+done+'/'+tt.length+' faites</span></div><div class="plan">'
      +(tt.length?tt.map(x=>{ const cur=x.time&&!x.done&&toMin(x.time)<=nm&&nm<endOf(x);
        return '<div class="item'+(x.done?' done':'')+(cur?' cur':'')+'"><button type="button" class="check" data-done="'+x.id+'" aria-pressed="'+!!x.done+'" aria-label="Marquer '+esc(x.title)+' comme faite">'+(x.done?'✓':'')+'</button>'
          +'<span class="time">'+(x.time?esc(x.time)+(x.end?'<br><span class="muted" style="font-size:11px">'+esc(x.end)+'</span>':''):'—')+'</span><div class="t"><span>'+esc(x.title)+'</span>'+(cur?'<small style="color:var(--lime)">en cours</small>':'')+'</div></div>'; }).join('')
        :'<p class="empty">Rien de prévu aujourd\'hui.</p>')
      +'</div><div class="grid2"><button class="btn primary sm" type="button" data-tab="day">Planifier ma journée</button><button class="btn outline sm" type="button" data-report="1">'+svg('pen')+' Mon rapport</button></div></div>';
    o+='<button type="button" class="linkcard" data-tab="past">'+svg('past')+'<div class="t"><b>Programme précédent</b><small>Tes journées et semaines passées, avec tes rapports</small></div><span class="mono" style="color:var(--lime)">›</span></button>';
    if(urg.length) o+='<div class="card"><div class="label">Objectifs urgents</div><div class="list">'+urg.slice(0,3).map(x=>'<div class="item"><div class="t"><span>'+esc(x.g.title)+'</span><small>'+fmt(x.g.deadline,{day:'numeric',month:'long',year:'numeric'})+'</small></div><span class="st '+x.s.k+'">'+x.s.t+'</span></div>').join('')+'</div></div>';
    return o;
  }


  /* ---------- Jours épuisés / restants et recommandation ---------- */
  function lifeBars(L){
    const used=Math.max(0,Math.floor((Date.now()-L.birth)/DAY)), left=Math.max(0,Math.ceil((L.end-Date.now())/DAY)), tot=Math.max(1,used+left);
    const pu=used/tot*100;
    return '<div class="tline" role="img" aria-label="Tu as épuisé '+fmtN(used)+' jours, il te reste '+fmtN(left)+' jours">'
      +'<div class="tl-top"><span>Épuisé <b>'+fmtN(used)+' j</b></span><span>Il te reste <b class="lime">'+fmtN(left)+' j</b></span></div>'
      +'<div class="tl-bar"><i class="u" style="width:'+pu+'%"></i><i class="l"></i><span class="mk" style="left:'+pu+'%"></span></div>'
      +'<div class="tl-ax"><span>naissance</span><span>aujourd’hui · '+L.age+' ans</span><span>'+prof().exp+' ans</span></div></div>';
  }
  const WHY=['pour réduire ton risque d’AVC','pour garder une tension normale','pour éloigner le diabète de type 2','pour protéger ton cœur','pour baisser ton stress'];
  let whyI=0;
  function recoInfo(){
    const N=pickNow(), nm=Math.floor(N.nm);
    if(N.mode==='now') return {dur:30,when:'après ta tâche en cours'};
    if(N.mode==='next'){ const free=Math.floor(N.o.s-nm)-5; return {dur:Math.max(10,Math.min(60,Math.floor(free/5)*5)),when:'avant ta tâche suivante'}; }
    return {dur:60,when:'maintenant'};
  }
  const durTxt=(m)=>m>=60?'d’1 h':'de '+m+' min';
  function recoBtn(){
    const r=recoInfo();
    return '<button type="button" class="reco" data-reco="1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8z"/><path d="M3.5 12h4l2-3 3 6 2-3h6"/></svg>'
      +'<span class="t">Faisons un petit sport <em>'+durTxt(r.dur)+'</em> '+r.when+' <span class="why" id="recoWhy">'+WHY[whyI]+'</span><small>Réf. OMS : au moins 150 min d’activité physique par semaine</small></span><span class="go">›</span></button>';
  }
  let sugList=[];
  const SUGS=[['Faire des étirements',15,'Dos, nuque et jambes'],['Faire des pompes et des abdos',15,'Renforcement sans matériel'],['Méditer et respirer calmement',10,'Pour baisser le stress'],['Boire un grand verre d’eau',5,'L’hydratation compte aussi']];
  function openReco(){
    const r=recoInfo();
    sugList=[['Faire du sport',r.dur,'Recommandé '+r.when+', '+WHY[whyI]],['Marcher',Math.min(30,r.dur),'Le plus simple pour le cœur et la tension']].concat(SUGS);
    sheet('<div class="between"><h2 style="font-size:18px">Améliorer ma santé</h2><button class="iconbtn" type="button" data-close="1" aria-label="Fermer">✕</button></div>'
      +'<p class="muted small" style="margin:0">Choisis une activité : elle s’ajoute à ton programme et apparaît dans le cercle « Maintenant ».</p>'
      +'<div class="list">'+sugList.map((x,i)=>'<div class="sug"'+(i===0?' style="border-color:var(--urgent)"':'')+'><div class="t"><b>'+x[0]+' · '+fmtDurMin(x[1])+'</b><small>'+x[2]+'</small></div><button class="btn primary sm" type="button" data-sug="'+i+'">Ajouter</button></div>').join('')+'</div>'
      +'<p class="muted small" style="margin:0">L’OMS recommande au moins 150 minutes d’activité physique modérée par semaine. Si tu as un problème de santé, demande à ton médecin quels efforts te conviennent.</p>');
  }
  function addSug(i){
    const x=sugList[i]; if(!x) return; const N=pickNow(); const n=new Date();
    let start=Math.ceil((n.getHours()*60+n.getMinutes()+1)/5)*5;
    if(N.mode==='now') start=Math.ceil(N.o.e/5)*5;
    let date=today(); if(start+x[1]>=24*60){ date=addDays(date,1); start=7*60; }
    S.tasks.push({id:uid(),date,time:toT(start),end:toT(start+x[1]),title:x[0]+(x[0]==='Faire du sport'||x[0]==='Marcher'?' '+fmtDurMin(x[1]):''),done:false,prio:true,goal:''});
    closeSheet(); commit('Ajouté à '+toT(start)+(date!==today()?' demain':''));
  }

  /* ---------- Maintenant ---------- */
  let nowKey='', nowState=null;
  function pickNow(){
    const t=today(), d=new Date(), nm=d.getHours()*60+d.getMinutes()+d.getSeconds()/60;
    const tt=S.tasks.filter(x=>x.date===t&&x.time&&!x.done).map(x=>({x,s:toMin(x.time),e:endOf(x)}));
    const cur=tt.filter(o=>o.s<=nm&&nm<o.e).sort((a,b)=>a.s-b.s);
    const late=tt.filter(o=>o.e<=nm).sort((a,b)=>b.e-a.e);
    const next=tt.filter(o=>o.s>nm).sort((a,b)=>a.s-b.s);
    if(cur.length) return {mode:'now',o:cur[0],late:late.length,nm};
    if(late.length) return {mode:'late',o:late[0],late:late.length,nm};
    if(next.length) return {mode:'next',o:next[0],late:0,nm};
    const any=S.tasks.filter(x=>x.date===t);
    return {mode:any.length&&any.every(x=>x.done)?'done':'free',late:0,nm};
  }
  function phrase(title,mode){
    const w=title.trim(); const f=w.split(/\s+/)[0].toLowerCase();
    const verb=f.length>3&&/(er|ir|re|oir)$/.test(f)&&!/^(le|la|les|une?)$/.test(f);
    const act=w.charAt(0).toLowerCase()+w.slice(1); const de=/^[aeiouyéèêàâîôûh]/i.test(act)?'d’':'de ';
    if(mode==='now') return verb?'Tu devrais être en train '+de+'<em>'+esc(act)+'</em> maintenant':'Maintenant, place à : <em>'+esc(w)+'</em>';
    if(mode==='late') return verb?'Tu devais <em>'+esc(act)+'</em>':'Pas encore fait : <em>'+esc(w)+'</em>';
    return verb?'Prépare-toi à <em>'+esc(act)+'</em>':'À suivre : <em>'+esc(w)+'</em>';
  }
  function renderNow(){
    const box=$('nowCard'); if(!box) return; const N=pickNow(); nowState=N;
    const key=N.mode+':'+(N.o?N.o.x.id+N.o.x.time+N.o.x.end:'')+':'+N.late;
    if(key!==nowKey){ nowKey=key; buildNow(box,N); }
    updateNow(N);
  }
  function buildNow(box,N){
    const R=96, C=2*Math.PI*R;
    box.className='nowcard'+(N.mode==='late'?' late':N.mode==='next'||N.mode==='done'||N.mode==='free'?' calm':'');
    const ring='<svg viewBox="0 0 220 220" aria-hidden="true"><circle cx="110" cy="110" r="'+R+'" fill="none" stroke="var(--empty)" stroke-width="10"/>'
      +'<circle id="nowArc" cx="110" cy="110" r="'+R+'" fill="none" stroke="var(--ring)" stroke-width="10" stroke-linecap="round" stroke-dasharray="'+C+'" stroke-dashoffset="'+C+'" transform="rotate(-90 110 110)" style="filter:drop-shadow(0 0 8px var(--ringglow))"/>'
      +'<g class="spin"><circle cx="110" cy="110" r="107" fill="none" stroke="var(--ring)" stroke-width="1.5" stroke-dasharray="2 9" opacity=".6"/><circle cx="110" cy="3" r="4" fill="var(--ring)"/></g></svg>';
    if(N.mode==='free'||N.mode==='done'){
      box.innerHTML='<div class="tag"><i></i>'+(N.mode==='done'?'JOURNÉE ACCOMPLIE':'TEMPS LIBRE')+'</div>'
        +'<div class="ringwrap">'+ring+'<div class="inner"><small>'+(N.mode==='done'?'tout est fait':'rien de prévu')+'</small><b>'+(N.mode==='done'?'✓':'—')+'</b></div></div>'
        +'<div class="say">'+(N.mode==='done'?'Bravo, ta journée est faite. Écris ton rapport.':'Aucune activité en ce moment. Planifie ta journée pour savoir quoi faire.')+'</div>'
        +'<div class="acts"><button class="btn primary" type="button" data-tab="day">Planifier</button><button class="btn outline" type="button" data-report="1">Mon rapport</button></div>';
      return; }
    const x=N.o.x;
    const tag=N.mode==='now'?'MAINTENANT':N.mode==='late'?'EN RETARD':'À SUIVRE';
    const lbl=N.mode==='now'?'reste':N.mode==='late'?'retard':'dans';
    box.innerHTML='<div class="tag"><i></i>'+tag+'</div>'
      +'<div class="ringwrap">'+ring+'<div class="inner"><small>'+lbl+'</small><b id="nowCd">00:00</b><span>'+(N.mode==='next'?'début à '+esc(x.time):'fin '+(N.mode==='late'?'prévue ':'à ')+toT(endOf(x)))+'</span></div></div>'
      +'<div class="say">'+phrase(x.title,N.mode)+'</div>'
      +'<div class="when">'+esc(x.time)+' – '+toT(endOf(x))+'</div>'
      +'<div class="acts"><button class="btn primary" type="button" data-finish="'+x.id+'">Tâche terminée</button><button class="btn outline" type="button" data-later="'+x.id+'">Faire plus tard</button></div>'
      +(N.mode!=='late'&&N.late?'<div class="more"><b>'+N.late+'</b> activité'+(N.late>1?'s':'')+' en retard aujourd\'hui</div>':N.mode==='late'&&N.late>1?'<div class="more"><b>'+(N.late-1)+'</b> autre'+(N.late>2?'s':'')+' en retard</div>':'');
  }
  function updateNow(N){
    if(!N.o) return; const cd=$('nowCd'), arc=$('nowArc'); if(!cd||!arc) return;
    const s=N.o.s, e=N.o.e, nm=N.nm, C=2*Math.PI*96;
    let sec, frac;
    if(N.mode==='now'){ sec=(e-nm)*60; frac=(nm-s)/(e-s);
      const box=$('nowCard'); const urgent=sec<=600; if(box.classList.contains('urgent')!==urgent) box.classList.toggle('urgent',urgent); }
    else if(N.mode==='late'){ sec=(nm-e)*60; frac=1; }
    else { sec=(s-nm)*60; frac=Math.max(0,1-(s-nm)/120); }
    cd.textContent=hms(sec); arc.setAttribute('stroke-dashoffset',String(C*(1-Math.min(1,Math.max(0,frac)))));
  }

  function postpone(id,opt){
    const x=findT(id); if(!x) return; const st=toMin(x.time||'09:00'); const dur=Math.max(5,endOf(x)-st);
    let date=today(), start;
    if(opt==='tomorrow'){ date=addDays(x.date,1); start=st; }

    else { const n=new Date(); start=Math.ceil((n.getHours()*60+n.getMinutes()+Number(opt))/5)*5; if(start>=24*60){ date=addDays(date,1); start-=24*60; } }
    x.date=date; x.time=toT(start); x.end=toT(Math.min(start+dur,23*60+59));

  function tick(){

  /* Particules de l'en-tête */
  let pRAF=null;
  function stopParticles(){ if(pRAF) cancelAnimationFrame(pRAF); pRAF=null; }
  function startParticles(){
    const cv=$('pc'); if(!cv) return; const ctx=cv.getContext('2d'); const dpr=devicePixelRatio||1;
    const W=cv.clientWidth, H=cv.clientHeight; cv.width=W*dpr; cv.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
    const pts=Array.from({length:34},()=>({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.15,vy:(Math.random()-.5)*.15,r:Math.random()*1.6+.6}));
    let reduce=false; try{reduce=matchMedia('(prefers-reduced-motion: reduce)').matches}catch(e){}
    const draw=()=>{ ctx.clearRect(0,0,W,H);
      for(let i=0;i<pts.length;i++){ const a=pts[i]; if(!reduce){a.x+=a.vx;a.y+=a.vy; if(a.x<0||a.x>W)a.vx*=-1; if(a.y<0||a.y>H)a.vy*=-1;}
        for(let j=i+1;j<pts.length;j++){ const b=pts[j]; const d=Math.hypot(a.x-b.x,a.y-b.y); if(d<90){ ctx.strokeStyle='rgba(198,244,50,'+(0.12*(1-d/90))+')'; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke(); } }
        ctx.fillStyle='rgba(198,244,50,.55)'; ctx.beginPath(); ctx.arc(a.x,a.y,a.r,0,7); ctx.fill(); }
      if(!reduce&&cv.isConnected) pRAF=requestAnimationFrame(draw); };
    draw();
  }

      if(!arr.length) h+='<p class="empty">Rien pour l\'instant. Tes journées passées apparaîtront ici dès demain.</p>';
      arr.forEach(d=>{ const ts=tasksOn(d), dn=ts.filter(x=>x.done).length, r=S.reports.find(x=>x.type==='jour'&&x.date===d); const pct=ts.length?Math.round(dn/ts.length*100):0;
        h+='<button type="button" class="past" data-day="'+d+'"><span class="ring" style="background:conic-gradient(var(--lime) '+pct*3.6+'deg,var(--empty) 0)"><span style="background:var(--surface);width:36px;height:36px;border-radius:50%;display:grid;place-items:center">'+pct+'%</span></span>'
          +'<div class="t"><b>'+cap(fmt(d,{weekday:'long',day:'numeric',month:'long'}))+'</b><small>'+dn+'/'+ts.length+' tâches faites'+(r?' · humeur '+(r.mood||'—')+'/5'+(r.health!=null?' · santé '+r.health+' %':''):' · pas de rapport')+'</small>'+(r&&r.wins?'<small>« '+esc(r.wins.slice(0,90))+(r.wins.length>90?'…':'')+' »</small>':'')+'</div></button>'; });
    } else {
      const weeks=new Set(); S.tasks.forEach(x=>{const m=monday(x.date); if(m<monday(t)) weeks.add(m)}); S.reports.forEach(r=>{if(r.type==='semaine'&&r.date<monday(t)) weeks.add(r.date)});
      const arr=[...weeks].sort().reverse();
      if(!arr.length) h+='<p class="empty">Tes semaines passées apparaîtront ici à partir de lundi prochain.</p>';
      arr.forEach(m=>{ const end=addDays(m,6), ts=S.tasks.filter(x=>x.date>=m&&x.date<=end), dn=ts.filter(x=>x.done).length, r=S.reports.find(x=>x.type==='semaine'&&x.date===m); const pct=ts.length?Math.round(dn/ts.length*100):0;
        h+='<button type="button" class="past" data-wkgo="'+m+'"><span class="ring" style="background:conic-gradient(var(--lime) '+pct*3.6+'deg,var(--empty) 0)"><span style="background:var(--surface);width:36px;height:36px;border-radius:50%;display:grid;place-items:center">'+pct+'%</span></span>'
          +'<div class="t"><b>Semaine du '+fmt(m,{day:'numeric',month:'long'})+'</b><small>'+dn+'/'+ts.length+' tâches faites'+(r?' · bilan écrit':' · pas de bilan')+'</small>'+(r&&r.wins?'<small>« '+esc(r.wins.slice(0,90))+(r.wins.length>90?'…':'')+' »</small>':'')+'</div></button>'; });
    }
    return h+'</div>';
  }

  /* ---------- Programme de vie ---------- */
  function viewLife(){
    const L=life(), gs=S.goals.slice().sort((a,b)=>(a.done-b.done)||a.deadline.localeCompare(b.deadline));
    let h='<div class="pagehead"><div class="label">Programme</div><h1>Programme <span>de vie</span></h1></div>'
      +'<div class="card"><div class="between"><div class="label">Ma vie en semaines</div><span class="small mono muted">'+fmtN(L.lived)+' / '+fmtN(L.total)+'</span></div><canvas id="lifeCanvas" role="img" aria-label="Grille des semaines de ta vie"></canvas>'
      +'<div class="row small muted" style="flex-wrap:wrap;gap:12px"><span>■ vécues</span><span style="color:var(--late)">■ cette semaine</span><span style="color:var(--lime)">■ objectifs</span></div></div>'
      +'<form id="goalForm" class="card"><div class="label">Nouvel objectif</div>'
      +'<label class="field"><span>Mon rêve ou objectif</span><input id="gTitle" required maxlength="120" placeholder="Ex. Voyager au Japon"></label>'
      +'<div class="grid2"><label class="field"><span>Domaine</span><select id="gCat"><option>Santé</option><option>Carrière</option><option>Argent</option><option>Famille</option><option>Voyage</option><option>Apprendre</option><option>Autre</option></select></label>'
      +'<label class="field"><span>Échéance</span><input id="gDate" type="date" required value="'+addDays(today(),90)+'"></label></div>'
      +'<button class="btn primary" type="submit">Fixer l\'objectif</button></form>';
    if(!gs.length) h+='<p class="empty">Fixe ton premier objectif : LifeBook te dira combien de semaines il te reste pour l\'atteindre.</p>';
    gs.forEach(g=>{ const s=status(g), st=g.steps||[], dn=st.filter(x=>x.d).length, linked=S.tasks.filter(t=>t.goal===g.id), ld=linked.filter(t=>t.done).length;
      h+='<article class="goal '+s.k+'"><div class="between" style="align-items:flex-start"><h3>'+esc(g.title)+'</h3><span class="st '+s.k+'">'+s.t+'</span></div>'
        +'<div class="row small muted" style="flex-wrap:wrap"><span class="chip">'+esc(g.cat)+'</span><span>'+fmt(g.deadline,{day:'numeric',month:'long',year:'numeric'})+'</span>'+(linked.length?'<span>· '+ld+'/'+linked.length+' tâches</span>':'')+'</div>'
        +(st.length?'<div class="prog"><i style="width:'+(dn/st.length*100)+'%"></i></div><div class="list">'+st.map((x,i)=>'<div class="item'+(x.d?' done':'')+'" style="padding:6px 8px"><button type="button" class="check" data-step="'+g.id+':'+i+'" aria-pressed="'+!!x.d+'" aria-label="Étape '+esc(x.t)+'">'+(x.d?'✓':'')+'</button><div class="t"><span>'+esc(x.t)+'</span></div><button type="button" class="x" data-stepdel="'+g.id+':'+i+'" aria-label="Retirer l\'étape">✕</button></div>').join('')+'</div>':'')
        +(g.done?'':'<form class="row" data-stepadd="'+g.id+'"><input maxlength="100" placeholder="Ajouter une étape" aria-label="Nouvelle étape" id="sa-'+g.id+'"><button class="btn sm" type="submit">+</button></form>')
        +'<div class="row" style="flex-wrap:wrap"><button class="btn sm" type="button" data-gdone="'+g.id+'">'+(g.done?'Remettre en cours':'Objectif atteint')+'</button><button class="btn sm danger" type="button" data-gdel="'+g.id+'">Supprimer</button></div></article>';
    });
    return h;
  }
  function drawGrid(){
    const cv=$('lifeCanvas'); if(!cv) return; const ctx=cv.getContext('2d');
    const L=life(), rows=Number(prof().exp); const W=cv.clientWidth||340, lab=20;
    const pitch=(W-lab)/52, cell=Math.max(1.5,pitch*0.78); const H=Math.ceil(rows*pitch)+2; const dpr=devicePixelRatio||1;
    cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr); cv.style.height=H+'px'; ctx.setTransform(dpr,0,0,dpr,0,0);
    const css=(v)=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
    const marks={}; S.goals.forEach(g=>{const i=Math.floor((parse(g.deadline)-L.birth)/WEEK); if(i>L.lived&&i<rows*52) marks[i]=g.done?css('--muted'):css('--lime')});
    ctx.font='9px "JetBrains Mono", monospace'; ctx.fillStyle=css('--muted'); ctx.textAlign='right'; ctx.textBaseline='middle';
    for(let a=0;a<=rows;a+=10) ctx.fillText(String(a),lab-4,Math.min(H-5,Math.max(5,a*pitch)));
    for(let i=0;i<rows*52;i++){ const x=lab+(i%52)*pitch, y=Math.floor(i/52)*pitch;
      ctx.fillStyle=i===L.lived?css('--late'):(marks[i]||(i<L.lived?css('--lived'):css('--empty'))); ctx.fillRect(x,y,cell,cell); }
  }

  /* ---------- Feuilles ---------- */
  function sheet(html){ $('sheetRoot').innerHTML='<div class="sheet" id="sheet"><div role="dialog" aria-modal="true">'+html+'</div></div>'; }
  function closeSheet(){ $('sheetRoot').innerHTML=''; }
  function openProfile(){
    if(!S.profile) return; const p=prof();
    sheet('<div class="between"><h2 style="font-size:18px">Mon compte</h2><button class="iconbtn" type="button" data-close="1" aria-label="Fermer">✕</button></div>'
      +'<form id="profForm" class="list"><label class="field"><span>Prénom</span><input id="pName" maxlength="40" value="'+esc(p.name)+'"></label>'
      +'<div class="grid2"><label class="field"><span>Date de naissance</span><input id="pBirth" type="date" value="'+esc(p.birth)+'"></label>'
      +'<label class="field"><span>Espérance de vie (ans)</span><input id="pExp" type="number" min="40" max="120" value="'+esc(p.exp)+'"></label></div>'
      +'<div class="grid2"><label class="field"><span>Sommeil (h/nuit)</span><input id="pSleep" type="number" min="3" max="14" step="0.5" value="'+esc(p.sleep)+'"></label>'
      +'<label class="field"><span>Travail (h/semaine)</span><input id="pWork" type="number" min="0" max="100" value="'+esc(p.work)+'"></label></div>'
      +'<label class="field"><span>Âge de la retraite</span><input id="pRetire" type="number" min="30" max="90" value="'+esc(p.retire)+'"></label>'
      +'<button class="btn primary" type="submit">Enregistrer</button></form>');
  }
  function openHealth(){
    const v=S.health?S.health.v:70;
    sheet('<div class="between"><h2 style="font-size:18px">Mon état de santé</h2><button class="iconbtn" type="button" data-close="1" aria-label="Fermer">✕</button></div>'
      +'<form id="healthForm" class="list"><p class="muted small" style="margin:0">Comment te sens-tu aujourd\'hui, physiquement et moralement ?</p>'
      +'<div class="mono" id="hVal" style="font-size:44px;font-weight:800;color:var(--lime);text-align:center;text-shadow:0 0 18px var(--glow)">'+v+' %</div>'
      +'<input id="hRange" type="range" min="0" max="100" step="5" value="'+v+'" aria-label="État de santé en pourcentage">'
      +'<button class="btn primary" type="submit">Enregistrer</button></form>');
    $('hRange').addEventListener('input',()=>{ $('hVal').textContent=$('hRange').value+' %'; });
  }

  /* ---------- Événements ---------- */
  function toast(t){ const el=document.createElement('div'); el.className='toast'; el.textContent=t; document.body.appendChild(el); setTimeout(()=>el.remove(),1800); }
  function commit(msg){ render(); if(msg) toast(msg); if(!S.profile) return; clearTimeout(saveTimer); saveTimer=setTimeout(()=>store&&store.save(S),400); }
  const findT=(id)=>S.tasks.find(t=>t.id===id), findG=(id)=>S.goals.find(g=>g.id===id);
  let pendingDel=null;
  const go=(t)=>{ tab=t; render(); scrollTo(0,0); };

  document.addEventListener('click',(e)=>{
    if(e.target.id==='sheet'){ closeSheet(); return; }
    const b=e.target.closest('button'); if(!b) return; const ds=b.dataset;
    if(ds.tab){ closeSheet(); if(ds.tab==='day'&&tab!=='day') dayCur=today(); if(ds.tab==='week') weekCur=monday(today()); if(ds.tab==='month') monthCur=today().slice(0,7); if(ds.tab==='year') yearCur=new Date().getFullYear(); go(ds.tab); return; }
    if(ds.mo){ const [y,m]=monthCur.split('-').map(Number); const d=new Date(y,m-1+Number(ds.mo),1); monthCur=d.getFullYear()+'-'+pad(d.getMonth()+1); render(); return; }
    if(ds.yr){ yearCur+=Number(ds.yr); render(); return; }
    if(ds.month){ monthCur=ds.month; go('month'); return; }
    if(ds.report){ closeSheet(); dayCur=today(); go('day'); const box=$('repBox'); if(box){ box.open=true; box.scrollIntoView({block:'start'}); } return; }
    if(ds.health){ openHealth(); return; }
    if(ds.finish){ const x=findT(ds.finish); if(x){ x.done=true; commit('Bravo, tâche terminée !'); } return; }
    if(ds.later){ openLater(ds.later); return; }
    if(ds.reco){ openReco(); return; }
    if(ds.sug){ addSug(Number(ds.sug)); return; }
    if(ds.pl){ postpone(ds.id,ds.pl); return; }
    if(ds.close){ closeSheet(); return; }
    if(ds.wk){ weekCur=addDays(weekCur,7*Number(ds.wk)); render(); return; }
    if(ds.wkgo){ weekCur=ds.wkgo; go('week'); return; }
    if(ds.dy){ dayCur=addDays(dayCur,Number(ds.dy)); render(); return; }
    if(ds.day){ dayCur=ds.day; go('day'); return; }
    if(ds.pm){ pastMode=ds.pm; render(); return; }
    if(ds.done){ const t=findT(ds.done); t.done=!t.done; commit(); return; }
    if(ds.prio){ const t=findT(ds.prio); t.prio=!t.prio; commit(); return; }
    if(ds.del){ S.tasks=S.tasks.filter(t=>t.id!==ds.del); commit('Tâche supprimée'); return; }
    if(ds.step){ const [g,i]=ds.step.split(':'); const s=findG(g).steps[i]; s.d=!s.d; commit(); return; }
    if(ds.stepdel){ const [g,i]=ds.stepdel.split(':'); findG(g).steps.splice(Number(i),1); commit(); return; }
    if(ds.gdone){ const g=findG(ds.gdone); g.done=!g.done; commit(g.done?'Bravo, objectif atteint !':null); return; }
    if(ds.gdel){ if(pendingDel===ds.gdel){ S.goals=S.goals.filter(g=>g.id!==ds.gdel); S.tasks.forEach(t=>{if(t.goal===ds.gdel) t.goal=''}); pendingDel=null; commit('Objectif supprimé'); }
      else { pendingDel=ds.gdel; b.textContent='Confirmer la suppression'; setTimeout(()=>{ if(pendingDel===ds.gdel){ pendingDel=null; if(b.isConnected) b.textContent='Supprimer'; } },4000); } return; }
    if(ds.mood){ b.parentElement.querySelectorAll('[data-mood]').forEach(x=>x.setAttribute('aria-pressed',String(x===b))); return; }
    if(b.id==='openProfile'){ openProfile(); return; }
    if(b.id==='openSum'){ openSummary(); return; }
  });
  document.addEventListener('input',(e)=>{ if(e.target.id==='rHealth') $('rHv').textContent=e.target.value+' %'; });

  document.addEventListener('submit',(e)=>{
    e.preventDefault(); const f=e.target;
    if(f.id==='createForm'){ S.profile={name:$('cName').value.trim(),birth:$('cBirth').value,exp:Number($('cExp').value)||80,sleep:8,work:40,retire:60}; tab='home'; commit('Bienvenue dans ton LifeBook'); return; }
    if(f.id==='profForm'){ S.profile={name:$('pName').value.trim(),birth:$('pBirth').value||S.profile.birth,exp:Number($('pExp').value)||80,sleep:Number($('pSleep').value)||8,work:Number($('pWork').value)||0,retire:Number($('pRetire').value)||60}; closeSheet(); commit('Compte mis à jour'); return; }
    if(f.id==='healthForm'){ S.health={v:Number($('hRange').value),date:today()}; closeSheet(); commit('État de santé enregistré'); return; }
    if(f.id==='taskForm'){ const t=$('tTitle').value.trim(); if(!t) return;
      const tm=$('tTime').value, te=$('tEnd').value; S.tasks.push({id:uid(),date:dayCur,time:tm,end:(tm&&te&&te>tm)?te:'',title:t,done:false,prio:false,goal:$('tGoal').value}); commit('Tâche ajoutée'); setTimeout(()=>$('tTitle')&&$('tTitle').focus(),0); return; }
    if(f.id==='goalForm'){ const t=$('gTitle').value.trim(); if(!t) return;
      S.goals.push({id:uid(),title:t,cat:$('gCat').value,deadline:$('gDate').value,done:false,steps:[]}); commit('Objectif fixé'); return; }
    if(f.id==='focusForm'){ S.focus[weekCur]=[0,1,2].map(i=>$('f'+i).value.trim()); commit('Priorités enregistrées'); return; }
    if(f.id==='repForm'){ const type=f.dataset.type, key=f.dataset.key; const m=f.querySelector('[data-mood][aria-pressed="true"]');
      const r={id:uid(),type,date:key,mood:m?Number(m.dataset.mood):null,wins:$('rWins').value.trim(),lessons:$('rLessons').value.trim(),block:$('rBlock').value.trim(),next:$('rNext').value.trim()};
      if(type==='jour'){ r.health=Number($('rHealth').value); if(!S.health||key>=S.health.date) S.health={v:r.health,date:key}; }
      S.reports=S.reports.filter(x=>!(x.type===type&&x.date===key)); S.reports.push(r); commit(type==='jour'?'Rapport du jour enregistré':'Bilan de la semaine enregistré'); return; }
    if(f.dataset.stepadd){ const g=findG(f.dataset.stepadd); const t=f.querySelector('input').value.trim(); if(!t) return;
      (g.steps=g.steps||[]).push({t,d:false}); commit(); setTimeout(()=>{const n=$('sa-'+g.id); if(n) n.focus()},0); return; }
  });
  document.addEventListener('keydown',(e)=>{ if(e.key==='Escape'&&$('sheet')) closeSheet(); });
  addEventListener('resize',()=>{ if(tab==='life') drawGrid(); });

  /* ---------- Sauvegarde ---------- */
  function setSave(t){ $('saveState').textContent=t; }
  function normalize(d){ return {profile:d.profile||null,goals:d.goals||[],tasks:d.tasks||[],focus:d.focus||{},reports:d.reports||[],health:d.health||null}; }
  async function boot(){
    render(); setInterval(tick,1000);
    let db=null,user=null,id=null;
    try{ if(window.claude&&claude.use){ [db,user]=await Promise.all([claude.use('db'),claude.use('user')]); id=user?await user.id():null; } }catch(e){}
    if(db&&id){
      const ref=db.doc('data/users/'+id+'/lifebook');
      store={save(s){ setSave('Enregistrement…'); ref.set(JSON.parse(JSON.stringify(s))).then(()=>setSave('Enregistré')).catch(e=>setSave(e&&e.code==='quota_exceeded'?'Espace plein':'Non enregistré')); }};
      try{ const snap=await ref.get(); if(snap.exists){ S=normalize(JSON.parse(JSON.stringify(snap.data()))); setSave('Enregistré'); } }catch(e){ setSave('Hors ligne'); }
    } else {
      store={save(s){ try{ localStorage.setItem('lifebook',JSON.stringify(s)); setSave('Sur cet appareil'); }catch(e){ setSave('Non enregistré'); } }};
      try{ const raw=localStorage.getItem('lifebook'); if(raw){ const d=JSON.parse(raw); if(d.profile){ S=normalize(d); setSave('Sur cet appareil'); } } }catch(e){}
    }
    render();
  }
  boot();
})();
</script>
