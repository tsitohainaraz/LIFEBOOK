<title>Ma journée LifeBook</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout : écran mobile, bandeau de dates, résumé, priorités, frise horaire (1 h = 64 px), bouton + flottant, feuille d'ajout */
:root{--bg:#060806;--surface:#0f130e;--surface-2:#161c14;--line:#26321f;--ink:#f3f6ee;--muted:#a3ad9b;--lime:#c6f432;--lime-ink:#0b1004;--late:#ff7070;
  --c-travail:#7fb2ff;--c-etudes:#b69cff;--c-sport:#c6f432;--c-spirituel:#ffd166;--c-sante:#ff8fa3;--c-famille:#ffb23d;--c-repos:#6fd3c8;--c-autre:#a3ad9b;
  --display:"Sora",system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,monospace;--hour:64px;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font-family:var(--display);font-size:15px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
h1,h2{margin:0;text-wrap:balance}
.wrap{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:16px;padding-bottom:calc(110px + env(safe-area-inset-bottom,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(6,8,6,.92);backdrop-filter:blur(10px);padding:12px 0 10px;display:flex;flex-direction:column;gap:12px;border-bottom:1px solid var(--line)}
.bar1{display:flex;align-items:center;gap:10px}
.bar1 img{width:30px;height:auto;border-radius:8px}
.bar1 b{font-weight:800;letter-spacing:-.02em}.bar1 b span{color:var(--lime)}
.bar1 .today{margin-left:auto;background:none;border:1px solid var(--line);border-radius:99px;min-height:36px;padding:0 12px;font-size:13px;font-weight:600}
.strip{display:grid;grid-template-columns:auto repeat(7,minmax(0,1fr)) auto;gap:4px;align-items:center}
.strip .nav{width:32px;height:44px;border:none;background:none;color:var(--muted);font-size:20px}
.strip .d{border:1px solid transparent;background:none;border-radius:14px;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:58px}
.strip .d small{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.strip .d b{font-family:var(--mono);font-size:17px}
.strip .d i{width:5px;height:5px;border-radius:50%;background:transparent}
.strip .d.has i{background:var(--muted)}
.strip .d.is-today b{color:var(--lime)}
.strip .d[aria-pressed="true"]{background:var(--lime);border-color:var(--lime)}
.strip .d[aria-pressed="true"] small,.strip .d[aria-pressed="true"] b{color:var(--lime-ink)}
.strip .d[aria-pressed="true"] i{background:var(--lime-ink)}
.title{display:flex;flex-direction:column;gap:4px}
.title .k{font-family:var(--mono);font-size:12px;color:var(--lime);letter-spacing:.08em;text-transform:uppercase}
.title h1{font-size:26px;font-weight:800;letter-spacing:-.03em}
.ex{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#7fb2ff;border:1px dashed #7fb2ff;border-radius:4px;padding:1px 6px;align-self:flex-start}
.intent{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:4px 4px 4px 14px}
.intent svg{width:18px;height:18px;color:var(--lime);flex:none}
.intent input{flex:1;min-width:0;background:none;border:none;min-height:44px;padding:0}
.intent input:focus{outline:none}
.sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.sum div{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:2px}
.sum b{font-family:var(--mono);font-size:22px;font-variant-numeric:tabular-nums}
.sum small{font-size:11px;color:var(--muted)}
.sum .lime b{color:var(--lime)}
.split{height:10px;border-radius:99px;overflow:hidden;display:flex;background:var(--surface-2)}
.split i{height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:11px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend span::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--c)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px}
.card h2{font-size:15px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.card h2 small{font-family:var(--mono);font-size:12px;color:var(--muted);font-weight:500}
.prio{display:flex;align-items:center;gap:10px;min-height:46px;padding:0 6px 0 12px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line)}
.prio .n{font-family:var(--mono);color:var(--lime);font-weight:700;width:14px}
.prio input[type=text]{flex:1;min-width:0;background:none;border:none;min-height:44px}
.prio input[type=text]:focus{outline:none}
.tick{width:30px;height:30px;border-radius:9px;border:2px solid var(--muted);background:none;flex:none;display:grid;place-items:center;font-weight:800;padding:0}
.tick[aria-pressed="true"]{background:var(--lime);border-color:var(--lime);color:var(--lime-ink)}
.prio.done input[type=text]{text-decoration:line-through;color:var(--muted)}
.tl{position:relative;display:grid;grid-template-columns:46px 1fr}
.hours{position:relative}
.hours span{position:absolute;left:0;font-family:var(--mono);font-size:11px;color:var(--muted);transform:translateY(-50%)}
.lane{position:relative;border-left:1px solid var(--line)}
.lane .hl{position:absolute;left:0;right:0;border-top:1px dashed var(--line)}
.slot{position:absolute;left:0;right:0;border:none;background:none;padding:0}
.slot:hover{background:rgba(198,244,50,.04)}
.blk{position:absolute;border-radius:12px;padding:8px 10px;text-align:left;border:1px solid color-mix(in srgb,var(--c) 45%,transparent);
  background:color-mix(in srgb,var(--c) 16%,var(--surface));border-left:4px solid var(--c);overflow:hidden;display:flex;flex-direction:column;gap:2px;min-height:26px}
.blk b{font-size:13.5px;font-weight:600;line-height:1.25;overflow-wrap:anywhere}
.blk small{font-family:var(--mono);font-size:11px;color:var(--muted)}
.blk .cat{font-size:10px;font-weight:700;color:var(--c);text-transform:uppercase;letter-spacing:.05em}
.blk.short{flex-direction:row;align-items:center;gap:8px;padding:2px 10px}
.blk.done{opacity:.55}.blk.done b{text-decoration:line-through}
.blk .ck{position:absolute;right:8px;top:8px;width:20px;height:20px;border-radius:6px;border:1.5px solid var(--c);display:grid;place-items:center;font-size:12px;font-weight:800;color:var(--lime-ink)}
.blk.done .ck{background:var(--c)}
.blk.short .ck{top:50%;transform:translateY(-50%)}
.now{position:absolute;left:-5px;right:0;height:2px;background:var(--lime);box-shadow:0 0 10px var(--lime);z-index:3;pointer-events:none}
.now::before{content:"";position:absolute;left:0;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--lime)}
.now span{position:absolute;right:0;top:-20px;font-family:var(--mono);font-size:11px;color:var(--lime);font-weight:700}
.fab{position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:25;width:62px;height:62px;border-radius:50%;border:none;background:var(--lime);color:var(--lime-ink);box-shadow:0 0 30px rgba(198,244,50,.45);display:grid;place-items:center}
.fab svg{width:28px;height:28px}
.sheet{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.65);display:flex;align-items:flex-end;justify-content:center}
.sheet>form{width:100%;max-width:480px;background:var(--surface);border-radius:24px 24px 0 0;border-top:1px solid var(--lime);max-height:92vh;overflow:auto;
  padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.grab{width:40px;height:4px;border-radius:9px;background:var(--line);align-self:center}
.sheet h2{font-size:19px;font-weight:800;display:flex;justify-content:space-between;align-items:center}
.x{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface-2)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.field>.lbl{font-size:13px;color:var(--muted)}
.field input,.field select{width:100%;min-height:50px;background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.field input:focus,.field select:focus{border-color:var(--lime);outline:none}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.cats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.cats label{position:relative}
.cats input{position:absolute;opacity:0;width:1px;height:1px}
.cats span{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 2px;border-radius:14px;border:1px solid var(--line);background:var(--surface-2);font-size:11px;font-weight:600;text-align:center;cursor:pointer}
.cats span i{width:14px;height:14px;border-radius:4px;background:var(--c)}
.cats input:checked+span{border-color:var(--c);background:color-mix(in srgb,var(--c) 18%,var(--surface-2))}
.cats input:focus-visible+span{outline:2px solid var(--lime)}
.durs{display:flex;gap:6px;flex-wrap:wrap}
.durs button{min-height:38px;padding:0 12px;border-radius:99px;border:1px solid var(--line);background:var(--surface-2);font-size:13px;font-family:var(--mono)}
.err{font-size:12px;color:var(--late)}.err:empty{display:none}
.sbtns{display:grid;grid-template-columns:auto 1fr;gap:10px}
.btn{min-height:52px;border-radius:999px;font-weight:700;padding:0 18px}
.btn.primary{background:var(--lime);border:none;color:var(--lime-ink)}
.btn.del{background:none;border:1px solid var(--line);color:var(--late)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--lime);color:var(--lime-ink);padding:8px 16px;border-radius:99px;font-size:13px;font-weight:700}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

    <div class="strip" id="strip"></div>

  <div class="title"><span class="k">Programme</span><h1 id="dayTitle">Ma journée</h1><span class="ex" id="exTag">Exemple</span></div>

  <label class="intent"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/></svg>
    <input id="intent" maxlength="100" placeholder="Mon intention du jour" aria-label="Mon intention du jour"></label>

  <div class="sum">
    <div class="lime"><b id="sPlan">0 h</b><small>planifiées</small></div>
    <div><b id="sFree">0 h</b><small>libres (éveillé)</small></div>
    <div><b id="sDone">0/0</b><small>faites</small></div>
  </div>
  <div class="split" id="split" aria-hidden="true"></div>
  <div class="legend" id="legend"></div>

  <div class="card">
    <h2>Mes 3 priorités <small id="pCount">0/3</small></h2>
    <div id="prios" style="display:flex;flex-direction:column;gap:8px"></div>
  </div>

  <div class="card" style="padding:14px 10px 14px 6px">
    <h2 style="padding:0 4px 0 10px">Mon emploi du temps <small>touche une heure libre pour ajouter</small></h2>
    <div class="tl"><div class="hours" id="hours"></div><div class="lane" id="lane"></div></div>
  </div>

<button class="fab" type="button" id="fab" aria-label="Ajouter une activité"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
<div id="sheetRoot"></div>

<script>
(function(){
  const $=(id)=>document.getElementById(id);
  const pad=(n)=>String(n).padStart(2,'0');
  const iso=(d)=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
  const parse=(s)=>new Date(s+'T12:00:00');
  const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
  const monday=(s)=>{const d=parse(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return iso(d)};
  const toMin=(t)=>{const [h,m]=t.split(':').map(Number);return h*60+m};
  const toT=(m)=>pad(Math.floor(m/60)%24)+':'+pad(m%60);
  const fmtDur=(m)=>{const h=Math.floor(m/60),r=m%60;return h?(h+' h'+(r?' '+pad(r):'')):r+' min'};
  const uid=()=>Math.random().toString(36).slice(2,9);
  const START=5, END=24, HOUR=64;
  const CATS=[['travail','Travail'],['etudes','Études'],['sport','Sport'],['spirituel','Spirituel'],['sante','Santé'],['famille','Famille'],['repos','Repos'],['autre','Autre']];
  const catName=Object.fromEntries(CATS);
  const TODAY=iso(new Date());
  let cur=TODAY, weekStart=monday(TODAY), isExample=true;
  const days={};
  days[TODAY]={intent:'Avancer sur mon rêve, sans oublier de bouger',prios:[{t:'Finir le rapport du projet',d:false},{t:'Séance de sport de 45 min',d:true},{t:'Appeler maman',d:false}],
    blocks:[
      {id:uid(),t:'Prière et lecture',c:'spirituel',s:'05:30',e:'06:00',d:true},
      {id:uid(),t:'Footing au parc',c:'sport',s:'06:00',e:'06:45',d:true},
      {id:uid(),t:'Petit-déjeuner',c:'sante',s:'07:00',e:'07:30',d:true},
      {id:uid(),t:'Travail concentré : rapport',c:'travail',s:'08:00',e:'11:30',d:false},
      {id:uid(),t:'Déjeuner en famille',c:'famille',s:'12:00',e:'13:00',d:false},
      {id:uid(),t:'Réunions',c:'travail',s:'14:00',e:'16:00',d:false},
      {id:uid(),t:'Cours en ligne',c:'etudes',s:'17:00',e:'18:00',d:false},
      {id:uid(),t:'Temps calme',c:'repos',s:'20:30',e:'21:30',d:false}
    ]};
  const get=(d)=>days[d]||(days[d]={intent:'',prios:[{t:'',d:false},{t:'',d:false},{t:'',d:false}],blocks:[]});

  function toast(t){ const el=document.createElement('div'); el.className='toast'; el.textContent=t; document.body.appendChild(el); setTimeout(()=>el.remove(),1700); }
  function markReal(){ if(isExample){ isExample=false; $('exTag').hidden=true; } }

  function renderStrip(){
    let h='<button class="nav" type="button" data-wk="-1" aria-label="Semaine précédente">‹</button>';
    for(let i=0;i<7;i++){ const d=addDays(weekStart,i), dt=parse(d);
      h+='<button type="button" class="d'+(d===TODAY?' is-today':'')+(days[d]&&days[d].blocks.length?' has':'')+'" data-day="'+d+'" aria-pressed="'+(d===cur)+'" aria-label="'+dt.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'})+'"><small>'+dt.toLocaleDateString('fr-FR',{weekday:'short'}).replace('.','').slice(0,3)+'</small><b>'+dt.getDate()+'</b><i></i></button>'; }
    h+='<button class="nav" type="button" data-wk="1" aria-label="Semaine suivante">›</button>';
    $('strip').innerHTML=h;
  }
  function render(){
    renderStrip(); const D=get(cur), dt=parse(cur);
    const label=dt.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
    $('dayTitle').textContent=(cur===TODAY?'Aujourd\'hui, ':'')+label.charAt(0).toUpperCase()+label.slice(1);
    $('intent').value=D.intent;
    // résumé
    const tot=D.blocks.reduce((a,b)=>a+Math.max(0,toMin(b.e)-toMin(b.s)),0);
    const awake=(16*60);
    $('sPlan').textContent=fmtDur(tot).replace(' min','m');
    $('sFree').textContent=fmtDur(Math.max(0,awake-tot)).replace(' min','m');
    $('sDone').textContent=D.blocks.filter(b=>b.d).length+'/'+D.blocks.length;
    const byCat={}; D.blocks.forEach(b=>byCat[b.c]=(byCat[b.c]||0)+toMin(b.e)-toMin(b.s));
    $('split').innerHTML=CATS.filter(([k])=>byCat[k]).map(([k])=>'<i style="width:'+(byCat[k]/awake*100)+'%;background:var(--c-'+k+')"></i>').join('');
    $('legend').innerHTML=CATS.filter(([k])=>byCat[k]).map(([k,n])=>'<span style="--c:var(--c-'+k+')">'+n+' '+fmtDur(byCat[k])+'</span>').join('');
    // priorités
    $('prios').innerHTML=D.prios.map((p,i)=>'<div class="prio'+(p.d?' done':'')+'"><span class="n">'+(i+1)+'</span><input type="text" data-prio="'+i+'" maxlength="80" placeholder="Priorité '+(i+1)+'" aria-label="Priorité '+(i+1)+'"><button type="button" class="tick" data-ptick="'+i+'" aria-pressed="'+p.d+'" aria-label="Priorité '+(i+1)+' faite">'+(p.d?'✓':'')+'</button></div>').join('');
    document.querySelectorAll('[data-prio]').forEach((el,i)=>el.value=D.prios[i].t);
    $('pCount').textContent=D.prios.filter(p=>p.d&&p.t).length+'/'+D.prios.filter(p=>p.t).length;
    renderTimeline();
  }
  function renderTimeline(){
    const D=get(cur); const H=(END-START)*HOUR;
    $('hours').style.height=$('lane').style.height=H+'px';
    let hh='', lane='';
    for(let h=START;h<=END;h++){ const y=(h-START)*HOUR; hh+='<span style="top:'+y+'px">'+pad(h%24)+':00</span>'; if(h<END){ lane+='<div class="hl" style="top:'+y+'px"></div><button type="button" class="slot" data-slot="'+h+'" style="top:'+y+'px;height:'+HOUR+'px" aria-label="Ajouter à '+h+' h"></button>'; } }
    $('hours').innerHTML=hh;
    // voies pour les chevauchements
    const bl=D.blocks.slice().sort((a,b)=>toMin(a.s)-toMin(b.s));
    const placed=[]; let cluster=[], clusterEnd=-1;
    const flush=()=>{ const lanes=Math.max(1,...cluster.map(x=>x.lane+1)); cluster.forEach(x=>x.n=lanes); cluster=[]; };
    bl.forEach(b=>{ const s=toMin(b.s), e=toMin(b.e); if(s>=clusterEnd&&cluster.length){ flush(); }
      const used=cluster.filter(x=>toMin(x.b.e)>s).map(x=>x.lane); let l=0; while(used.includes(l)) l++;
      const o={b,lane:l}; cluster.push(o); placed.push(o); clusterEnd=Math.max(clusterEnd,e); });
    if(cluster.length) flush();
    placed.forEach(({b,lane:l,n})=>{
      const s=toMin(b.s), e=toMin(b.e); const top=(s-START*60)/60*HOUR, h=Math.max(26,(e-s)/60*HOUR-3);
      const short=h<46; const w=100/n;
      lane+='<button type="button" class="blk'+(short?' short':'')+(b.d?' done':'')+'" data-blk="'+b.id+'" style="--c:var(--c-'+b.c+');top:'+(top+1)+'px;height:'+h+'px;left:calc('+(l*w)+'% + 6px);width:calc('+w+'% - 10px)">'
        +(short?'':'<span class="cat">'+catName[b.c]+'</span>')+'<b>'+esc(b.t)+'</b><small>'+b.s+' – '+b.e+'</small><span class="ck" aria-hidden="true">'+(b.d?'✓':'')+'</span></button>';
    });
    if(cur===TODAY){ const n=new Date(); const m=n.getHours()*60+n.getMinutes(); if(m>=START*60&&m<=END*60) lane+='<div class="now" style="top:'+((m-START*60)/60*HOUR)+'px"><span>'+toT(m)+'</span></div>'; }
    $('lane').innerHTML=lane;
  }
  const esc=(s)=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  /* Feuille d'ajout / modification */
  function openSheet(b,startHour){
    const edit=!!b; const D=get(cur);
    const s=b?b.s:pad(startHour!=null?startHour:Math.min(22,new Date().getHours()+1))+':00';
    const e=b?b.e:toT(toMin(s)+60);
    $('sheetRoot').innerHTML='<div class="sheet" id="sheet"><form id="sf" role="dialog" aria-modal="true" aria-label="'+(edit?'Modifier':'Ajouter')+' une activité" novalidate><span class="grab"></span>'
      +'<h2>'+(edit?'Modifier l\'activité':'Nouvelle activité')+'<button type="button" class="x" data-close="1" aria-label="Fermer">✕</button></h2>'
      +'<div class="field"><label for="fT">Activité</label><input id="fT" maxlength="80" placeholder="Ex. Séance de musculation" value="'+(b?esc(b.t):'')+'"><span class="err" id="fTErr"></span></div>'
      +'<div class="field"><span class="lbl">Catégorie</span><div class="cats">'+CATS.map(([k,n])=>'<label style="--c:var(--c-'+k+')"><input type="radio" name="cat" value="'+k+'"'+((b?b.c:'autre')===k?' checked':'')+'><span><i></i>'+n+'</span></label>').join('')+'</div></div>'
      +'<div class="grid2"><div class="field"><label for="fS">Début</label><input id="fS" type="time" value="'+s+'"></div><div class="field"><label for="fE">Fin</label><input id="fE" type="time" value="'+e+'"></div></div>'
      +'<div class="durs" aria-label="Durée rapide">'+[15,30,45,60,90,120].map(m=>'<button type="button" data-dur="'+m+'">'+fmtDur(m)+'</button>').join('')+'</div><span class="err" id="fSErr"></span>'
      +'<div class="field"><label for="fR">Rappel</label><select id="fR"><option>Aucun</option><option selected>10 min avant</option><option>30 min avant</option><option>1 h avant</option></select></div>'
      +'<div class="sbtns">'+(edit?'<button type="button" class="btn del" id="del">Supprimer</button>':'<span></span>')+'<button class="btn primary" type="submit">'+(edit?'Enregistrer':'Ajouter à ma journée')+'</button></div></form></div>';
    $('sf').dataset.id=b?b.id:''; setTimeout(()=>$('fT').focus(),50);
  }
  function closeSheet(){ $('sheetRoot').innerHTML=''; }

  document.addEventListener('click',(e)=>{
    if(e.target.id==='sheet'){ closeSheet(); return; }
    const b=e.target.closest('button'); if(!b) return; const ds=b.dataset;
    if(ds.day){ cur=ds.day; render(); return; }
    if(ds.wk){ weekStart=addDays(weekStart,7*Number(ds.wk)); cur=addDays(cur,7*Number(ds.wk)); render(); return; }
    if(b.id==='goToday'){ cur=TODAY; weekStart=monday(TODAY); render(); return; }
    if(b.id==='fab'){ openSheet(null); return; }
    if(ds.slot){ openSheet(null,Number(ds.slot)); return; }
    if(ds.blk){ const blk=get(cur).blocks.find(x=>x.id===ds.blk); const r=b.getBoundingClientRect();
      if(e.clientX>r.right-40&&e.clientY<r.top+44){ blk.d=!blk.d; markReal(); render(); if(blk.d) toast('Bravo, c\'est fait'); return; }
      openSheet(blk); return; }
    if(ds.ptick){ const p=get(cur).prios[Number(ds.ptick)]; if(!p.t){ document.querySelector('[data-prio="'+ds.ptick+'"]').focus(); return; } p.d=!p.d; markReal(); render(); return; }
    if(ds.close){ closeSheet(); return; }
    if(ds.dur){ const s=$('fS').value||'08:00'; $('fE').value=toT(Math.min(toMin(s)+Number(ds.dur),23*60+59)); return; }
    if(b.id==='del'){ const D=get(cur); D.blocks=D.blocks.filter(x=>x.id!==$('sf').dataset.id); closeSheet(); markReal(); render(); toast('Activité supprimée'); return; }
  });
  document.addEventListener('input',(e)=>{
    if(e.target.id==='intent'){ get(cur).intent=e.target.value; markReal(); }
    if(e.target.dataset.prio!=null){ const D=get(cur); D.prios[Number(e.target.dataset.prio)].t=e.target.value; markReal();
      $('pCount').textContent=D.prios.filter(p=>p.d&&p.t).length+'/'+D.prios.filter(p=>p.t).length; }
  });
  document.addEventListener('submit',(e)=>{
    if(e.target.id!=='sf') return; e.preventDefault();
    $('fTErr').textContent=''; $('fSErr').textContent='';
    const t=$('fT').value.trim(), s=$('fS').value, en=$('fE').value, c=(document.querySelector('input[name="cat"]:checked')||{}).value||'autre';
    let ok=true; if(!t){ $('fTErr').textContent='Donne un nom à cette activité.'; ok=false; }
    if(!s||!en||toMin(en)<=toMin(s)){ $('fSErr').textContent='L\'heure de fin doit être après le début.'; ok=false; }
    else if(toMin(s)<START*60){ $('fSErr').textContent='La journée commence à 05:00 dans LifeBook.'; ok=false; }
    if(!ok) return;
    const D=get(cur), id=e.target.dataset.id;
    if(id){ Object.assign(D.blocks.find(x=>x.id===id),{t,c,s,e:en}); toast('Activité modifiée'); }
    else { D.blocks.push({id:uid(),t,c,s,e:en,d:false}); toast('Ajouté à ta journée'); }
    closeSheet(); markReal(); render();
  });
  document.addEventListener('keydown',(e)=>{ if(e.key==='Escape'&&$('sheet')) closeSheet(); });
  setInterval(()=>{ if(cur===TODAY) renderTimeline(); },60000);
  render();
  // centre la frise sur l'heure actuelle
  setTimeout(()=>{ const n=document.querySelector('.now'); if(n&&n.getBoundingClientRect().top>innerHeight) {} },0);
})();
</script>

</body></html>
