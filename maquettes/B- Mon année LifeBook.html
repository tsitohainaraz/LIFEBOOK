<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Mon année LifeBook</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout : écran mobile, sélecteur d'année, progression en 52 semaines, objectifs de l'année, trimestres, 12 mois, feuille par mois */
:root{--bg:#060806;--surface:#0f130e;--surface-2:#161c14;--line:#26321f;--ink:#f3f6ee;--muted:#a3ad9b;--lime:#c6f432;--lime-ink:#0b1004;--late:#ff7070;--empty:#1d261a;
  --c-sante:#ff8fa3;--c-carriere:#7fb2ff;--c-argent:#ffd166;--c-famille:#ffb23d;--c-spirituel:#e6c7ff;--c-etudes:#b69cff;--c-voyage:#6fd3c8;--c-sport:#c6f432;--c-autre:#a3ad9b;
  --display:"Sora",system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,monospace;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font-family:var(--display);font-size:15px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}
.wrap{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:16px;padding-bottom:calc(110px + env(safe-area-inset-bottom,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(6,8,6,.92);backdrop-filter:blur(10px);padding:12px 0;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.top img{width:30px;height:auto;border-radius:8px}
.top b{font-weight:800;letter-spacing:-.02em}.top b span{color:var(--lime)}
.ysel{margin-left:auto;display:flex;align-items:center;gap:2px;border:1px solid var(--line);border-radius:99px;padding:2px}
.ysel button{width:36px;height:36px;border:none;background:none;border-radius:50%;color:var(--muted);font-size:18px}
.ysel span{font-family:var(--mono);font-weight:700;min-width:46px;text-align:center}
.title{display:flex;flex-direction:column;gap:4px;padding-top:4px}
.title .k{font-family:var(--mono);font-size:12px;color:var(--lime);letter-spacing:.08em;text-transform:uppercase}
.title h1{font-size:28px;font-weight:800;letter-spacing:-.03em}
.title h1 span{color:var(--lime)}
.ex{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#7fb2ff;border:1px dashed #7fb2ff;border-radius:4px;padding:1px 6px;align-self:flex-start}
.word{display:flex;flex-direction:column;gap:6px;background:radial-gradient(120% 120% at 0% 0%,#1a2610 0%,var(--surface) 60%);border:1px solid var(--line);border-radius:18px;padding:14px 16px}
.word small{font-size:12px;color:var(--muted)}
.word input{background:none;border:none;font-size:24px;font-weight:800;letter-spacing:-.02em;color:var(--lime);min-height:40px;padding:0;width:100%;text-shadow:0 0 18px rgba(198,244,50,.35)}
.word input::placeholder{color:#55613f}
.word input:focus{outline:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card h2{font-size:15px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:8px}
.card h2 small{font-family:var(--mono);font-size:12px;color:var(--muted);font-weight:500}
.big{display:flex;align-items:baseline;gap:8px}
.big b{font-family:var(--mono);font-size:44px;font-weight:800;color:var(--lime);line-height:1;text-shadow:0 0 18px rgba(198,244,50,.4)}
.big span{color:var(--muted);font-size:14px}
.bar{height:8px;border-radius:99px;background:var(--empty);overflow:hidden}.bar i{display:block;height:100%;background:var(--lime)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stats div{background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:10px}
.stats b{display:block;font-family:var(--mono);font-size:18px}
.stats small{font-size:11px;color:var(--muted)}
.weeks{display:grid;grid-template-columns:repeat(13,minmax(0,1fr));gap:4px}
.weeks i{aspect-ratio:1;border-radius:4px;background:var(--empty);position:relative}
.weeks i.past{background:#e9eee2}
.weeks i.now{background:var(--lime);box-shadow:0 0 10px var(--lime)}
.weeks i.ms::after{content:"";position:absolute;inset:-2px;border-radius:5px;border:2px solid var(--c)}
.wleg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:11px;color:var(--muted)}
.wleg span{display:inline-flex;align-items:center;gap:5px}
.wleg span i{width:9px;height:9px;border-radius:3px;display:inline-block}
.goal{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line);border-left:4px solid var(--c)}
.goal .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.goal .t b{font-size:14.5px;overflow-wrap:anywhere}
.goal .t small{font-size:12px;color:var(--muted)}
.goal .cat{font-size:10px;font-weight:700;color:var(--c);text-transform:uppercase;letter-spacing:.05em}
.goal.done b{text-decoration:line-through;color:var(--muted)}
.tick{width:30px;height:30px;border-radius:9px;border:2px solid var(--muted);background:none;flex:none;display:grid;place-items:center;font-weight:800;padding:0}
.tick[aria-pressed="true"]{background:var(--lime);border-color:var(--lime);color:var(--lime-ink)}
.mini{height:5px;border-radius:9px;background:var(--empty);overflow:hidden}.mini i{display:block;height:100%;background:var(--c)}
.add{display:flex;gap:8px}
.add input{flex:1;min-width:0;min-height:46px;background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:0 12px}
.add select{min-height:46px;background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:0 8px;max-width:118px}
.add button,.btn{min-height:46px;border-radius:99px;border:none;background:var(--lime);color:var(--lime-ink);font-weight:700;padding:0 16px}
.domains{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.domains button{flex:none;min-height:36px;padding:0 12px;border-radius:99px;border:1px solid var(--line);background:var(--surface-2);font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:6px}
.domains button i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.domains button[aria-pressed="true"]{border-color:var(--lime);color:var(--lime)}
.qtabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:99px;padding:4px}
.qtabs button{min-height:38px;border:none;background:none;border-radius:99px;font-weight:700;color:var(--muted);font-family:var(--mono)}
.qtabs button[aria-pressed="true"]{background:var(--lime);color:var(--lime-ink)}
.qfocus{display:flex;align-items:center;gap:10px;background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:0 12px}
.qfocus small{color:var(--muted);font-size:12px;white-space:nowrap}
.qfocus input{flex:1;min-width:0;background:none;border:none;min-height:46px}
.qfocus input:focus{outline:none}
.months{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.month{min-height:104px;border-radius:16px;border:1px solid var(--line);background:var(--surface);padding:10px;display:flex;flex-direction:column;gap:6px;text-align:left}
.month b{font-size:14px}
.month small{font-size:11px;color:var(--muted)}
.month .dots{display:flex;flex-wrap:wrap;gap:4px;margin-top:auto}
.month .dots i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.month.cur{border-color:var(--lime);box-shadow:0 0 0 1px var(--lime) inset}
.month.cur b{color:var(--lime)}
.month.past{opacity:.6}
.ms{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line)}
.ms .date{font-family:var(--mono);font-size:12px;color:var(--lime);min-width:44px}
.ms .t{flex:1;min-width:0;overflow-wrap:anywhere}
.ms .t small{display:block;font-size:11px;color:var(--c);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.ms.done .t span{text-decoration:line-through;color:var(--muted)}
.x{width:36px;height:36px;border-radius:50%;border:none;background:none;color:var(--muted);flex:none}
.empty{color:var(--muted);font-size:13.5px;text-align:center;margin:4px 0}
.sheet{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.65);display:flex;align-items:flex-end;justify-content:center}
.sheet>div{width:100%;max-width:480px;background:var(--surface);border-radius:24px 24px 0 0;border-top:1px solid var(--lime);max-height:90vh;overflow:auto;
  padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.grab{width:40px;height:4px;border-radius:9px;background:var(--line);align-self:center}
.sheet h2{font-size:20px;font-weight:800;display:flex;justify-content:space-between;align-items:center}
.close{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface-2)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:13px;color:var(--muted)}
.field input,.field select{width:100%;min-height:48px;background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.err{font-size:12px;color:var(--late)}.err:empty{display:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(40px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--lime);color:var(--lime-ink);padding:8px 16px;border-radius:99px;font-size:13px;font-weight:700}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

    <div class="ysel"><button type="button" data-y="-1" aria-label="Année précédente">‹</button><span id="yLbl">2026</span><button type="button" data-y="1" aria-label="Année suivante">›</button></div></div>

  <div class="title"><span class="k">Programme</span><h1>Mon année <span id="yTitle">2026</span></h1><span class="ex" id="exTag">Exemple</span></div>

  <label class="word"><small>Mon mot de l'année</small><input id="word" maxlength="24" placeholder="Ex. Discipline"></label>

  <div class="card">
    <h2>Le temps qu'il reste <small id="wkNow"></small></h2>
    <div class="big"><b id="wLeft">0</b><span id="wLeftLbl">semaines avant la fin de l'année</span></div>
    <div class="bar" aria-hidden="true"><i id="yBar"></i></div>
    <div class="stats"><div><b id="dLeft">0</b><small>jours restants</small></div><div><b id="gDone">0/0</b><small>objectifs atteints</small></div><div><b id="msN">0</b><small>étapes prévues</small></div></div>
    <div class="weeks" id="weeks" role="img" aria-label="Les 52 semaines de l'année"></div>
    <div class="wleg"><span><i style="background:#e9eee2"></i>passées</span><span><i style="background:var(--lime)"></i>cette semaine</span><span><i style="border:2px solid var(--muted)"></i>étape prévue</span></div>
  </div>

  <div class="card">
    <h2>Mes objectifs de l'année <small id="gCount"></small></h2>
    <div class="domains" id="domains"></div>
    <div id="goals" style="display:flex;flex-direction:column;gap:8px"></div>
    <form class="add" id="gForm"><input id="gT" maxlength="80" placeholder="Nouvel objectif" aria-label="Nouvel objectif"><select id="gC" aria-label="Domaine"></select><button type="submit" aria-label="Ajouter l'objectif">+</button></form>
  </div>

  <div class="card">
    <h2>Par trimestre</h2>
    <div class="qtabs" id="qtabs"></div>
    <label class="qfocus"><small>Focus du trimestre</small><input id="qFocus" maxlength="60" placeholder="Ce qui compte ce trimestre"></label>
    <div id="qList" style="display:flex;flex-direction:column;gap:8px"></div>
  </div>

  <div class="card">
    <h2>Mes 12 mois <small>touche un mois</small></h2>
    <div class="months" id="months"></div>
  </div>
</div>
<div id="sheetRoot"></div>

<script>
(function(){
  const $=(id)=>document.getElementById(id);
  const pad=(n)=>String(n).padStart(2,'0');
  const esc=(s)=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const uid=()=>Math.random().toString(36).slice(2,9);
  const MONTHS=['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
  const CATS=[['sante','Santé'],['sport','Sport'],['carriere','Carrière'],['argent','Argent'],['famille','Famille'],['spirituel','Spirituel'],['etudes','Études'],['voyage','Voyage'],['autre','Autre']];
  const catName=Object.fromEntries(CATS);
  const NOW=new Date(), Y0=NOW.getFullYear();
  let Y=Y0, quarter=Math.floor(NOW.getMonth()/3), filter='all', isExample=true;
  const years={};
  years[Y0]={word:'Discipline',qfocus:['Poser les bases','Construire','Accélérer','Finir en beauté'],
    goals:[
      {id:uid(),t:'Courir un semi-marathon',c:'sport',q:3,done:false},
      {id:uid(),t:'Épargner 3 mois de salaire',c:'argent',q:3,done:false},
      {id:uid(),t:'Lire 12 livres',c:'etudes',q:3,done:false},
      {id:uid(),t:'Faire un bilan de santé complet',c:'sante',q:1,done:true},
      {id:uid(),t:'Un voyage avec la famille',c:'voyage',q:2,done:false}
    ],
    ms:[]};
  // étapes d'exemple réparties sur l'année
  [['Bilan sanguin',1,12,'sante',true],['S\'inscrire au club de course',2,3,'sport',true],['Ouvrir un compte épargne',2,20,'argent',true],['Réserver le voyage',5,10,'voyage',true],
   ['Course de 10 km',8,14,'sport',false],['Voyage en famille',9,22,'voyage',false],['Lire le 9e livre',9,30,'etudes',false],['Semi-marathon',11,8,'sport',false],['Bilan de l\'année',12,28,'autre',false]]
   .forEach(([t,m,d,c,done])=>{ const dt=new Date(Y0,m-1,d); years[Y0].ms.push({id:uid(),t,c,date:Y0+'-'+pad(m)+'-'+pad(d),done:dt<NOW?done:false}); });
  // relier chaque objectif à son trimestre (q = index 0..3)
  const get=(y)=>years[y]||(years[y]={word:'',qfocus:['','','',''],goals:[],ms:[]});
  function weekOf(d){ const s=new Date(d.getFullYear(),0,1); return Math.min(51,Math.floor((d-s)/(7*864e5))); }
  function toast(t){ const el=document.createElement('div'); el.className='toast'; el.textContent=t; document.body.appendChild(el); setTimeout(()=>el.remove(),1700); }
  function markReal(){ if(isExample){ isExample=false; $('exTag').hidden=true; } }

  function render(){
    const Yd=get(Y); $('yLbl').textContent=Y; $('yTitle').textContent=Y; $('word').value=Yd.word;
    const start=new Date(Y,0,1), end=new Date(Y+1,0,1);
    const frac=Math.min(1,Math.max(0,(NOW-start)/(end-start)));
    const daysLeft=Math.max(0,Math.ceil((end-NOW)/864e5)); const daysTot=Math.round((end-start)/864e5);
    $('dLeft').textContent=Y<Y0?0:(Y>Y0?daysTot:daysLeft);
    const wl=Y<Y0?0:(Y>Y0?52:Math.max(0,52-weekOf(NOW)-1));
    $('wLeft').textContent=wl; $('yBar').style.width=(frac*100)+'%';
    $('wkNow').textContent=Y===Y0?'semaine '+(weekOf(NOW)+1)+' / 52':(Y<Y0?'année terminée':'à venir');
    $('wLeftLbl').textContent=Y>Y0?'semaines pour cette année':'semaines avant la fin de l\'année';
    $('gDone').textContent=Yd.goals.filter(g=>g.done).length+'/'+Yd.goals.length;
    $('msN').textContent=Yd.ms.length;
    // 52 semaines
    const msW={}; Yd.ms.forEach(m=>{ msW[weekOf(new Date(m.date+'T12:00:00'))]=m.c; });
    const cw=Y===Y0?weekOf(NOW):(Y<Y0?52:-1);
    let w=''; for(let i=0;i<52;i++){ const cls=[i<cw?'past':'',i===cw?'now':'',msW[i]?'ms':''].join(' '); w+='<i class="'+cls+'"'+(msW[i]?' style="--c:var(--c-'+msW[i]+')"':'')+'></i>'; }
    $('weeks').innerHTML=w;
    // domaines + objectifs
    const used=CATS.filter(([k])=>Yd.goals.some(g=>g.c===k));
    $('domains').innerHTML='<button type="button" data-f="all" aria-pressed="'+(filter==='all')+'" style="--c:var(--lime)"><i></i>Tous</button>'+used.map(([k,n])=>'<button type="button" data-f="'+k+'" aria-pressed="'+(filter===k)+'" style="--c:var(--c-'+k+')"><i></i>'+n+'</button>').join('');
    const gs=Yd.goals.filter(g=>filter==='all'||g.c===filter).sort((a,b)=>a.done-b.done||a.q-b.q);
    $('gCount').textContent=Yd.goals.filter(g=>g.done).length+' / '+Yd.goals.length;
    $('goals').innerHTML=gs.length?gs.map(g=>{ const ms=Yd.ms.filter(m=>m.c===g.c); const md=ms.filter(m=>m.done).length;
      return '<div class="goal'+(g.done?' done':'')+'" style="--c:var(--c-'+g.c+')"><div class="t"><span class="cat">'+catName[g.c]+' · avant fin T'+(g.q+1)+'</span><b>'+esc(g.t)+'</b>'
        +(ms.length?'<div class="mini"><i style="width:'+(md/ms.length*100)+'%"></i></div><small>'+md+'/'+ms.length+' étapes '+catName[g.c].toLowerCase()+' faites</small>':'<small>Ajoute des étapes dans les mois ci-dessous</small>')+'</div>'
        +'<button type="button" class="tick" data-gtick="'+g.id+'" aria-pressed="'+g.done+'" aria-label="Objectif atteint">'+(g.done?'✓':'')+'</button><button type="button" class="x" data-gdel="'+g.id+'" aria-label="Supprimer l\'objectif">✕</button></div>'; }).join('')
      :'<p class="empty">Aucun objectif pour l\'instant. Écris ton premier ci-dessous.</p>';
    $('gC').innerHTML=CATS.map(([k,n])=>'<option value="'+k+'">'+n+'</option>').join('');
    // trimestres
    $('qtabs').innerHTML=[0,1,2,3].map(q=>'<button type="button" data-q="'+q+'" aria-pressed="'+(q===quarter)+'">T'+(q+1)+'</button>').join('');
    $('qFocus').value=Yd.qfocus[quarter]||'';
    const qms=Yd.ms.filter(m=>Math.floor((Number(m.date.slice(5,7))-1)/3)===quarter).sort((a,b)=>a.date.localeCompare(b.date));
    const qg=Yd.goals.filter(g=>g.q===quarter);
    $('qList').innerHTML=(qg.length?'<small style="color:var(--muted);font-size:12px">Objectifs à atteindre ce trimestre : '+qg.map(g=>esc(g.t)).join(', ')+'</small>':'')
      +(qms.length?qms.map(msRow).join(''):'<p class="empty">Aucune étape ce trimestre. Touche un mois pour en ajouter.</p>');
    // mois
    $('months').innerHTML=MONTHS.map((n,i)=>{ const ms=Yd.ms.filter(m=>Number(m.date.slice(5,7))-1===i); const cur=Y===Y0&&i===NOW.getMonth(); const past=Y<Y0||(Y===Y0&&i<NOW.getMonth());
      return '<button type="button" class="month'+(cur?' cur':'')+(past?' past':'')+'" data-m="'+i+'"><b>'+n+'</b><small>'+(ms.length?ms.filter(m=>m.done).length+'/'+ms.length+' étapes':'Rien de prévu')+'</small><span class="dots">'+ms.map(m=>'<i style="--c:var(--c-'+m.c+')"></i>').join('')+'</span></button>'; }).join('');
  }
  function msRow(m){ const d=new Date(m.date+'T12:00:00');
    return '<div class="ms'+(m.done?' done':'')+'" style="--c:var(--c-'+m.c+')"><span class="date">'+pad(d.getDate())+' '+MONTHS[d.getMonth()].slice(0,3).toLowerCase()+'.</span><div class="t"><small>'+catName[m.c]+'</small><span>'+esc(m.t)+'</span></div>'
      +'<button type="button" class="tick" data-mtick="'+m.id+'" aria-pressed="'+m.done+'" aria-label="Étape faite">'+(m.done?'✓':'')+'</button><button type="button" class="x" data-mdel="'+m.id+'" aria-label="Supprimer l\'étape">✕</button></div>'; }

  function openMonth(i){
    const Yd=get(Y); const ms=Yd.ms.filter(m=>Number(m.date.slice(5,7))-1===i).sort((a,b)=>a.date.localeCompare(b.date));
    const last=new Date(Y,i+1,0).getDate();
    $('sheetRoot').innerHTML='<div class="sheet" id="sheet"><div role="dialog" aria-modal="true" aria-label="'+MONTHS[i]+' '+Y+'"><span class="grab"></span>'
      +'<h2>'+MONTHS[i]+' '+Y+'<button type="button" class="close" data-close="1" aria-label="Fermer">✕</button></h2>'
      +'<div style="display:flex;flex-direction:column;gap:8px" id="mList">'+(ms.length?ms.map(msRow).join(''):'<p class="empty">Rien de prévu ce mois-ci.</p>')+'</div>'
      +'<form id="mForm" data-m="'+i+'" style="display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--line);padding-top:14px" novalidate>'
      +'<div class="field"><label for="mT">Nouvelle étape</label><input id="mT" maxlength="80" placeholder="Ex. Inscription à la salle de sport"><span class="err" id="mTErr"></span></div>'
      +'<div class="grid2"><div class="field"><label for="mD">Date</label><input id="mD" type="date" min="'+Y+'-'+pad(i+1)+'-01" max="'+Y+'-'+pad(i+1)+'-'+pad(last)+'" value="'+Y+'-'+pad(i+1)+'-'+pad(Math.min(15,last))+'"></div>'
      +'<div class="field"><label for="mC">Domaine</label><select id="mC">'+CATS.map(([k,n])=>'<option value="'+k+'">'+n+'</option>').join('')+'</select></div></div>'
      +'<button class="btn" type="submit">Ajouter à '+MONTHS[i].toLowerCase()+'</button></form></div></div>';
  }
  const closeSheet=()=>{ $('sheetRoot').innerHTML=''; };
  const findMs=(id)=>get(Y).ms.find(m=>m.id===id);

  document.addEventListener('click',(e)=>{
    if(e.target.id==='sheet'){ closeSheet(); return; }
    const b=e.target.closest('button'); if(!b) return; const ds=b.dataset; const Yd=get(Y);
    if(ds.y){ Y+=Number(ds.y); filter='all'; quarter=Y===Y0?Math.floor(NOW.getMonth()/3):0; render(); return; }
    if(ds.f){ filter=ds.f; render(); return; }
    if(ds.q){ quarter=Number(ds.q); render(); return; }
    if(ds.m){ openMonth(Number(ds.m)); return; }
    if(ds.close){ closeSheet(); return; }
    if(ds.gtick){ const g=Yd.goals.find(x=>x.id===ds.gtick); g.done=!g.done; markReal(); render(); if(g.done) toast('Objectif atteint, bravo !'); return; }
    if(ds.gdel){ Yd.goals=Yd.goals.filter(x=>x.id!==ds.gdel); markReal(); render(); toast('Objectif supprimé'); return; }
    if(ds.mtick){ const m=findMs(ds.mtick); m.done=!m.done; markReal(); render(); if($('sheet')) openMonth(Number(m.date.slice(5,7))-1); return; }
    if(ds.mdel){ const m=findMs(ds.mdel); const mi=Number(m.date.slice(5,7))-1; Yd.ms=Yd.ms.filter(x=>x.id!==ds.mdel); markReal(); render(); if($('sheet')) openMonth(mi); toast('Étape supprimée'); return; }
  });
  document.addEventListener('input',(e)=>{
    const Yd=get(Y);
    if(e.target.id==='word'){ Yd.word=e.target.value; markReal(); }
    if(e.target.id==='qFocus'){ Yd.qfocus[quarter]=e.target.value; markReal(); }
  });
  document.addEventListener('submit',(e)=>{
    e.preventDefault(); const Yd=get(Y);
    if(e.target.id==='gForm'){ const t=$('gT').value.trim(); if(!t){ $('gT').focus(); return; }
      Yd.goals.push({id:uid(),t,c:$('gC').value,q:3,done:false}); $('gT').value=''; markReal(); render(); toast('Objectif ajouté'); return; }
    if(e.target.id==='mForm'){ const t=$('mT').value.trim(); $('mTErr').textContent=''; if(!t){ $('mTErr').textContent='Écris l\'étape à prévoir.'; $('mT').focus(); return; }
      const i=Number(e.target.dataset.m); Yd.ms.push({id:uid(),t,c:$('mC').value,date:$('mD').value||(Y+'-'+pad(i+1)+'-15'),done:false}); markReal(); render(); openMonth(i); toast('Étape ajoutée'); return; }
  });
  document.addEventListener('keydown',(e)=>{ if(e.key==='Escape'&&$('sheet')) closeSheet(); });
  render();
})();
</script>

</body></html>
