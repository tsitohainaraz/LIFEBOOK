<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Mon mois LifeBook</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout : écran mobile, sélecteur de mois, objectifs du mois, calendrier 7 colonnes, semaines, suivi d'habitudes, feuille par jour */
:root{--bg:#060806;--surface:#0f130e;--surface-2:#161c14;--line:#26321f;--ink:#f3f6ee;--muted:#a3ad9b;--lime:#c6f432;--lime-ink:#0b1004;--late:#ff7070;--empty:#1d261a;
  --c-travail:#7fb2ff;--c-etudes:#b69cff;--c-sport:#c6f432;--c-spirituel:#ffd166;--c-sante:#ff8fa3;--c-famille:#ffb23d;--c-argent:#6fd3c8;--c-autre:#a3ad9b;
  --display:"Sora",system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,monospace;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font-family:var(--display);font-size:15px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
h1,h2{margin:0;text-wrap:balance}
.wrap{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:16px;padding-bottom:calc(60px + env(safe-area-inset-bottom,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(6,8,6,.92);backdrop-filter:blur(10px);padding:12px 0;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.top img{width:30px;height:auto;border-radius:8px}
.top b{font-weight:800;letter-spacing:-.02em}.top b span{color:var(--lime)}
.msel{margin-left:auto;display:flex;align-items:center;gap:2px;border:1px solid var(--line);border-radius:99px;padding:2px}
.msel button{width:36px;height:36px;border:none;background:none;border-radius:50%;color:var(--muted);font-size:18px}
.msel span{font-family:var(--mono);font-weight:700;font-size:13px;min-width:70px;text-align:center}
.title{display:flex;flex-direction:column;gap:4px;padding-top:4px}
.title .k{font-family:var(--mono);font-size:12px;color:var(--lime);letter-spacing:.08em;text-transform:uppercase}
.title h1{font-size:28px;font-weight:800;letter-spacing:-.03em}
.title h1 span{color:var(--lime)}
.ex{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#7fb2ff;border:1px dashed #7fb2ff;border-radius:4px;padding:1px 6px;align-self:flex-start}
.focus{display:flex;flex-direction:column;gap:6px;background:radial-gradient(120% 120% at 0% 0%,#1a2610 0%,var(--surface) 60%);border:1px solid var(--line);border-radius:18px;padding:14px 16px}
.focus small{font-size:12px;color:var(--muted)}
.focus input{background:none;border:none;font-size:20px;font-weight:800;letter-spacing:-.02em;color:var(--lime);min-height:36px;padding:0;width:100%}
.focus input::placeholder{color:#55613f}
.focus input:focus{outline:none}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stats div{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px}
.stats b{display:block;font-family:var(--mono);font-size:22px}
.stats small{font-size:11px;color:var(--muted)}
.stats .lime b{color:var(--lime);text-shadow:0 0 14px rgba(198,244,50,.35)}
.bar{height:8px;border-radius:99px;background:var(--empty);overflow:hidden}.bar i{display:block;height:100%;background:var(--lime)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card h2{font-size:15px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:8px}
.card h2 small{font-family:var(--mono);font-size:12px;color:var(--muted);font-weight:500}
.row{display:flex;align-items:center;gap:10px;padding:0 6px 0 12px;min-height:48px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line)}
.row .n{font-family:var(--mono);color:var(--lime);font-weight:700;width:14px}
.row input[type=text]{flex:1;min-width:0;background:none;border:none;min-height:46px}
.row input[type=text]:focus{outline:none}
.row.done input[type=text]{text-decoration:line-through;color:var(--muted)}
.tick{width:30px;height:30px;border-radius:9px;border:2px solid var(--muted);background:none;flex:none;display:grid;place-items:center;font-weight:800;padding:0}
.tick[aria-pressed="true"]{background:var(--lime);border-color:var(--lime);color:var(--lime-ink)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .h{font-size:10.5px;color:var(--muted);text-align:center;text-transform:uppercase;font-weight:600;padding-bottom:4px}
.day{aspect-ratio:1/1.12;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:6px 2px 6px;min-width:0}
.day b{font-family:var(--mono);font-size:14px;font-weight:700}
.day .dots{display:flex;gap:2px;flex-wrap:wrap;justify-content:center;min-height:6px}
.day .dots i{width:5px;height:5px;border-radius:50%;background:var(--c)}
.day.out{visibility:hidden}
.day.past{opacity:.5}
.day.today{border-color:var(--lime);box-shadow:0 0 12px rgba(198,244,50,.35)}
.day.today b{color:var(--lime)}
.day.weekend{background:var(--surface)}
.weeks{display:flex;flex-direction:column;gap:8px}
.wk{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line)}
.wk.cur{border-color:var(--lime)}
.wk .l{width:52px;flex:none}
.wk .l b{display:block;font-size:13px}
.wk .l small{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.wk input{flex:1;min-width:0;background:none;border:none;min-height:40px}
.wk input:focus{outline:none}
.wk .cnt{font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap}
.hab{display:flex;flex-direction:column;gap:12px}
.habrow{display:flex;flex-direction:column;gap:6px}
.habrow .hd{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13.5px;font-weight:600}
.habrow .hd small{font-family:var(--mono);font-size:12px;color:var(--lime)}
.habrow .hd button{border:none;background:none;color:var(--muted);width:30px;height:30px;border-radius:50%}
.cells{display:grid;grid-template-columns:repeat(16,minmax(0,1fr));gap:3px}
.cells button{aspect-ratio:1;border-radius:4px;border:none;background:var(--empty);padding:0;min-width:0}
.cells button[aria-pressed="true"]{background:var(--lime)}
.cells button.today{outline:1.5px solid var(--lime);outline-offset:1px}
.cells button.future{opacity:.35}
.add{display:flex;gap:8px}
.add input{flex:1;min-width:0;min-height:46px;background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:0 12px}
.btn,.add button{min-height:46px;border-radius:99px;border:none;background:var(--lime);color:var(--lime-ink);font-weight:700;padding:0 16px}
.ev{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);border-left:4px solid var(--c)}
.ev .t{flex:1;min-width:0;overflow-wrap:anywhere}
.ev .t small{display:block;font-size:11px;color:var(--c);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.ev .time{font-family:var(--mono);font-size:12px;color:var(--lime);min-width:42px}
.ev.done .t span{text-decoration:line-through;color:var(--muted)}
.x{width:36px;height:36px;border-radius:50%;border:none;background:none;color:var(--muted);flex:none}
.empty{color:var(--muted);font-size:13.5px;text-align:center;margin:4px 0}
.sheet{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.65);display:flex;align-items:flex-end;justify-content:center}
.sheet>div{width:100%;max-width:480px;background:var(--surface);border-radius:24px 24px 0 0;border-top:1px solid var(--lime);max-height:90vh;overflow:auto;
  padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.grab{width:40px;height:4px;border-radius:9px;background:var(--line);align-self:center}
.sheet h2{font-size:20px;font-weight:800;display:flex;justify-content:space-between;align-items:center;gap:8px}
.close{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface-2);flex:none}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:13px;color:var(--muted)}
.field input,.field select{width:100%;min-height:48px;background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.err{font-size:12px;color:var(--late)}.err:empty{display:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(30px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--lime);color:var(--lime-ink);padding:8px 16px;border-radius:99px;font-size:13px;font-weight:700}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

    <div class="msel"><button type="button" data-mv="-1" aria-label="Mois précédent">‹</button><span id="mLbl"></span><button type="button" data-mv="1" aria-label="Mois suivant">›</button></div></div>

  <div class="title"><span class="k">Programme</span><h1>Mon mois de <span id="mTitle"></span></h1><span class="ex" id="exTag">Exemple</span></div>

  <label class="focus"><small>Le défi du mois</small><input id="focus" maxlength="40" placeholder="Ex. Zéro sucre ajouté"></label>

  <div class="stats">
    <div class="lime"><b id="sLeft">0</b><small>jours restants</small></div>
    <div><b id="sEv">0/0</b><small>activités faites</small></div>
    <div><b id="sHab">0 %</b><small>habitudes tenues</small></div>
  </div>
  <div class="bar" aria-hidden="true"><i id="mBar"></i></div>

  <div class="card">
    <h2>Mes 3 objectifs du mois <small id="oCount"></small></h2>
    <div id="objs" style="display:flex;flex-direction:column;gap:8px"></div>
  </div>

  <div class="card">
    <h2>Calendrier <small>touche un jour</small></h2>
    <div class="cal" id="cal"></div>
  </div>

  <div class="card">
    <h2>Semaine par semaine</h2>
    <div class="weeks" id="weeks"></div>
  </div>

  <div class="card">
    <h2>Suivi des habitudes <small>une case = un jour</small></h2>
    <div class="hab" id="habits"></div>
    <form class="add" id="hForm"><input id="hT" maxlength="30" placeholder="Nouvelle habitude" aria-label="Nouvelle habitude"><button type="submit" aria-label="Ajouter l'habitude">+</button></form>
  </div>
</div>
<div id="sheetRoot"></div>

<script>
(function(){
  const $=(id)=>document.getElementById(id);
  const pad=(n)=>String(n).padStart(2,'0');
  const esc=(s)=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const uid=()=>Math.random().toString(36).slice(2,9);
  const MONTHS=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
  const CATS=[['travail','Travail'],['etudes','Études'],['sport','Sport'],['spirituel','Spirituel'],['sante','Santé'],['famille','Famille'],['argent','Argent'],['autre','Autre']];
  const catName=Object.fromEntries(CATS);
  const NOW=new Date(); const TY=NOW.getFullYear(), TM=NOW.getMonth(), TD=NOW.getDate();
  let Y=TY, M=TM, isExample=true;
  const store={};
  const key=(y,m)=>y+'-'+pad(m+1);
  const get=(y,m)=>store[key(y,m)]||(store[key(y,m)]={focus:'',objs:[{t:'',d:false},{t:'',d:false},{t:'',d:false}],wk:{},ev:[],habits:[]});
  // exemple pour le mois en cours
  (function(){ const S=get(TY,TM); const dim=new Date(TY,TM+1,0).getDate();
    S.focus='Bouger chaque jour';
    S.objs=[{t:'Faire 12 séances de sport',d:false},{t:'Finir le module de formation',d:true},{t:'Mettre 100 000 Ar de côté',d:false}];
    S.wk={0:'Reprendre le rythme',1:'Formation',2:'Épargne',3:'Famille'};
    const ex=[[2,'07:00','Séance de sport','sport'],[5,'09:00','Réunion d\'équipe','travail'],[8,'18:00','Module 3 de formation','etudes'],[10,'10:00','Culte / prière','spirituel'],
      [12,'08:00','Dépôt épargne','argent'],[14,'07:00','Séance de sport','sport'],[17,'15:00','Contrôle chez le médecin','sante'],[20,'12:00','Déjeuner chez les parents','famille'],
      [23,'07:00','Séance de sport','sport'],[26,'19:00','Bilan du mois','autre'],[28,'09:00','Présentation du projet','travail']];
    ex.forEach(([d,t,n,c])=>{ if(d<=dim) S.ev.push({id:uid(),d,time:t,t:n,c,done:(TY*10000+TM*100+d)<(TY*10000+TM*100+TD)}); });
    const pat=(p)=>Array.from({length:dim},(_,i)=>i+1<TD&&p(i));
    S.habits=[{id:uid(),t:'Sport 30 min',days:pat(i=>i%3!==2)},{id:uid(),t:'Lire 20 pages',days:pat(i=>i%4!==0)},{id:uid(),t:'Boire 2 L d\'eau',days:pat(i=>i%5!==3)},{id:uid(),t:'Prière / méditation',days:pat(()=>true)}];
  })();
  function toast(t){ const el=document.createElement('div'); el.className='toast'; el.textContent=t; document.body.appendChild(el); setTimeout(()=>el.remove(),1700); }
  function markReal(){ if(isExample){ isExample=false; $('exTag').hidden=true; } }
  const cmp=(y,m,d)=>{ const a=y*10000+m*100+d, b=TY*10000+TM*100+TD; return a<b?-1:a>b?1:0; };

  function render(){
    const S=get(Y,M), dim=new Date(Y,M+1,0).getDate();
    $('mLbl').textContent=new Date(Y,M,1).toLocaleDateString('fr-FR',{month:'short',year:'numeric'}); $('mTitle').textContent=MONTHS[M]; $('focus').value=S.focus;
    const left=(Y===TY&&M===TM)?dim-TD:(cmp(Y,M,1)<0?0:dim);
    $('sLeft').textContent=left; $('mBar').style.width=((dim-left)/dim*100)+'%';
    $('sEv').textContent=S.ev.filter(e=>e.done).length+'/'+S.ev.length;
    const elapsed=(Y===TY&&M===TM)?TD-1:(cmp(Y,M,1)<0?dim:0);
    const habTot=S.habits.length*elapsed, habOk=S.habits.reduce((a,h)=>a+h.days.slice(0,elapsed).filter(Boolean).length,0);
    $('sHab').textContent=(habTot?Math.round(habOk/habTot*100):0)+' %';
    // objectifs
    $('objs').innerHTML=S.objs.map((o,i)=>'<div class="row'+(o.d?' done':'')+'"><span class="n">'+(i+1)+'</span><input type="text" data-obj="'+i+'" maxlength="80" placeholder="Objectif '+(i+1)+'" aria-label="Objectif '+(i+1)+'"><button type="button" class="tick" data-otick="'+i+'" aria-pressed="'+o.d+'" aria-label="Objectif '+(i+1)+' atteint">'+(o.d?'✓':'')+'</button></div>').join('');
    document.querySelectorAll('[data-obj]').forEach((el,i)=>el.value=S.objs[i].t);
    $('oCount').textContent=S.objs.filter(o=>o.d&&o.t).length+'/'+S.objs.filter(o=>o.t).length;
    // calendrier
    const first=(new Date(Y,M,1).getDay()+6)%7;
    let c=['lun','mar','mer','jeu','ven','sam','dim'].map(d=>'<span class="h">'+d+'</span>').join('');
    for(let i=0;i<first;i++) c+='<span class="day out"></span>';
    for(let d=1;d<=dim;d++){ const evs=S.ev.filter(e=>e.d===d); const wd=(first+d-1)%7; const st=cmp(Y,M,d);
      c+='<button type="button" class="day'+(st===0?' today':'')+(st<0?' past':'')+(wd>=5?' weekend':'')+'" data-day="'+d+'" aria-label="'+d+' '+MONTHS[M]+(evs.length?', '+evs.length+' activité(s)':'')+'"><b>'+d+'</b><span class="dots">'+evs.slice(0,4).map(e=>'<i style="--c:var(--c-'+e.c+')"></i>').join('')+'</span></button>'; }
    $('cal').innerHTML=c;
    // semaines
    let w='', wi=0; let d=1;
    while(d<=dim){ const wd=(first+d-1)%7; const end=Math.min(dim,d+(6-wd)); const cnt=S.ev.filter(e=>e.d>=d&&e.d<=end).length;
      const cur=Y===TY&&M===TM&&TD>=d&&TD<=end;
      w+='<div class="wk'+(cur?' cur':'')+'"><div class="l"><b>Sem. '+(wi+1)+'</b><small>'+d+'–'+end+'</small></div><input data-wk="'+wi+'" maxlength="60" placeholder="Focus de la semaine" aria-label="Focus de la semaine '+(wi+1)+'"><span class="cnt">'+cnt+' act.</span></div>';
      d=end+1; wi++; }
    $('weeks').innerHTML=w; document.querySelectorAll('[data-wk]').forEach(el=>el.value=S.wk[el.dataset.wk]||'');
    // habitudes
    $('habits').innerHTML=S.habits.length?S.habits.map(h=>{ while(h.days.length<dim) h.days.push(false);
      const ok=h.days.slice(0,dim).filter(Boolean).length;
      return '<div class="habrow"><div class="hd"><span>'+esc(h.t)+'</span><span style="display:flex;align-items:center;gap:4px"><small>'+ok+'/'+dim+'</small><button type="button" data-hdel="'+h.id+'" aria-label="Supprimer l\'habitude">✕</button></span></div><div class="cells">'
        +h.days.slice(0,dim).map((v,i)=>{ const st=cmp(Y,M,i+1); return '<button type="button" data-hab="'+h.id+':'+i+'" aria-pressed="'+v+'" class="'+(st===0?'today':'')+(st>0?' future':'')+'" aria-label="'+esc(h.t)+', '+(i+1)+' '+MONTHS[M]+'"></button>'; }).join('')+'</div></div>'; }).join('')
      :'<p class="empty">Ajoute une habitude à suivre chaque jour.</p>';
  }

  function openDay(d){
    const S=get(Y,M); const evs=S.ev.filter(e=>e.d===d).sort((a,b)=>(a.time||'').localeCompare(b.time||''));
    const dt=new Date(Y,M,d); const lbl=dt.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
    $('sheetRoot').innerHTML='<div class="sheet" id="sheet"><div role="dialog" aria-modal="true" aria-label="'+lbl+'"><span class="grab"></span>'
      +'<h2>'+lbl.charAt(0).toUpperCase()+lbl.slice(1)+'<button type="button" class="close" data-close="1" aria-label="Fermer">✕</button></h2>'
      +'<div style="display:flex;flex-direction:column;gap:8px">'+(evs.length?evs.map(e=>'<div class="ev'+(e.done?' done':'')+'" style="--c:var(--c-'+e.c+')"><span class="time">'+(e.time||'—')+'</span><div class="t"><small>'+catName[e.c]+'</small><span>'+esc(e.t)+'</span></div>'
        +'<button type="button" class="tick" data-etick="'+e.id+'" aria-pressed="'+e.done+'" aria-label="Activité faite">'+(e.done?'✓':'')+'</button><button type="button" class="x" data-edel="'+e.id+'" aria-label="Supprimer">✕</button></div>').join(''):'<p class="empty">Rien de prévu ce jour-là.</p>')+'</div>'
      +'<form id="eForm" data-d="'+d+'" style="display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--line);padding-top:14px" novalidate>'
      +'<div class="field"><label for="eT">Nouvelle activité</label><input id="eT" maxlength="80" placeholder="Ex. Rendez-vous chez le dentiste"><span class="err" id="eTErr"></span></div>'
      +'<div class="grid2"><div class="field"><label for="eH">Heure</label><input id="eH" type="time" value="09:00"></div><div class="field"><label for="eC">Catégorie</label><select id="eC">'+CATS.map(([k,n])=>'<option value="'+k+'">'+n+'</option>').join('')+'</select></div></div>'
      +'<button class="btn" type="submit">Ajouter ce jour-là</button></form></div></div>';
  }
  const closeSheet=()=>{ $('sheetRoot').innerHTML=''; };

  document.addEventListener('click',(e)=>{
    if(e.target.id==='sheet'){ closeSheet(); return; }
    const b=e.target.closest('button'); if(!b) return; const ds=b.dataset; const S=get(Y,M);
    if(ds.mv){ M+=Number(ds.mv); if(M<0){M=11;Y--;} if(M>11){M=0;Y++;} render(); return; }
    if(ds.day){ openDay(Number(ds.day)); return; }
    if(ds.close){ closeSheet(); return; }
    if(ds.otick){ const o=S.objs[Number(ds.otick)]; if(!o.t){ document.querySelector('[data-obj="'+ds.otick+'"]').focus(); return; } o.d=!o.d; markReal(); render(); if(o.d) toast('Objectif du mois atteint !'); return; }
    if(ds.hab){ const [id,i]=ds.hab.split(':'); const h=S.habits.find(x=>x.id===id); h.days[Number(i)]=!h.days[Number(i)]; markReal(); render(); return; }
    if(ds.hdel){ S.habits=S.habits.filter(x=>x.id!==ds.hdel); markReal(); render(); toast('Habitude supprimée'); return; }
    if(ds.etick){ const ev=S.ev.find(x=>x.id===ds.etick); ev.done=!ev.done; markReal(); render(); openDay(ev.d); return; }
    if(ds.edel){ const ev=S.ev.find(x=>x.id===ds.edel); S.ev=S.ev.filter(x=>x.id!==ds.edel); markReal(); render(); openDay(ev.d); toast('Activité supprimée'); return; }
  });
  document.addEventListener('input',(e)=>{ const S=get(Y,M), t=e.target;
    if(t.id==='focus'){ S.focus=t.value; markReal(); }
    if(t.dataset.obj!=null){ S.objs[Number(t.dataset.obj)].t=t.value; markReal(); $('oCount').textContent=S.objs.filter(o=>o.d&&o.t).length+'/'+S.objs.filter(o=>o.t).length; }
    if(t.dataset.wk!=null){ S.wk[t.dataset.wk]=t.value; markReal(); }
  });
  document.addEventListener('submit',(e)=>{ e.preventDefault(); const S=get(Y,M);
    if(e.target.id==='hForm'){ const t=$('hT').value.trim(); if(!t){ $('hT').focus(); return; } S.habits.push({id:uid(),t,days:[]}); $('hT').value=''; markReal(); render(); toast('Habitude ajoutée'); return; }
    if(e.target.id==='eForm'){ const t=$('eT').value.trim(); $('eTErr').textContent=''; if(!t){ $('eTErr').textContent='Écris l\'activité à prévoir.'; $('eT').focus(); return; }
      const d=Number(e.target.dataset.d); S.ev.push({id:uid(),d,time:$('eH').value,t,c:$('eC').value,done:false}); markReal(); render(); openDay(d); toast('Activité ajoutée'); }
  });
  document.addEventListener('keydown',(e)=>{ if(e.key==='Escape'&&$('sheet')) closeSheet(); });
  render();
})();
</script>

</body></html>
