<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Ma semaine LifeBook</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout : écran mobile, sélecteur de semaine, thème, résumé, priorités, vue 7 colonnes heure par heure, liste jour par jour, bilan */
:root{--bg:#060806;--surface:#0f130e;--surface-2:#161c14;--line:#26321f;--ink:#f3f6ee;--muted:#a3ad9b;--lime:#c6f432;--lime-ink:#0b1004;--late:#ff7070;--empty:#1d261a;
  --c-travail:#7fb2ff;--c-etudes:#b69cff;--c-sport:#c6f432;--c-spirituel:#ffd166;--c-sante:#ff8fa3;--c-famille:#ffb23d;--c-repos:#6fd3c8;--c-autre:#a3ad9b;
  --display:"Sora",system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,monospace;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font-family:var(--display);font-size:15px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
h1,h2{margin:0;text-wrap:balance}
.wrap{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:16px;padding-bottom:calc(110px + env(safe-area-inset-bottom,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(6,8,6,.92);backdrop-filter:blur(10px);padding:12px 0;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.top img{width:30px;height:auto;border-radius:8px}
.top b{font-weight:800;letter-spacing:-.02em}.top b span{color:var(--lime)}
.wsel{margin-left:auto;display:flex;align-items:center;gap:2px;border:1px solid var(--line);border-radius:99px;padding:2px}
.wsel button{width:36px;height:36px;border:none;background:none;border-radius:50%;color:var(--muted);font-size:18px}
.wsel span{font-family:var(--mono);font-weight:700;font-size:12px;min-width:92px;text-align:center}
.title{display:flex;flex-direction:column;gap:4px;padding-top:4px}
.title .k{font-family:var(--mono);font-size:12px;color:var(--lime);letter-spacing:.08em;text-transform:uppercase}
.title h1{font-size:28px;font-weight:800;letter-spacing:-.03em}
.title h1 span{color:var(--lime)}
.title p{margin:0;color:var(--muted);font-size:13px}
.ex{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#7fb2ff;border:1px dashed #7fb2ff;border-radius:4px;padding:1px 6px;align-self:flex-start}
.theme{display:flex;flex-direction:column;gap:6px;background:radial-gradient(120% 120% at 0% 0%,#1a2610 0%,var(--surface) 60%);border:1px solid var(--line);border-radius:18px;padding:14px 16px}
.theme small{font-size:12px;color:var(--muted)}
.theme input{background:none;border:none;font-size:20px;font-weight:800;letter-spacing:-.02em;color:var(--lime);min-height:36px;padding:0;width:100%}
.theme input::placeholder{color:#55613f}
.theme input:focus{outline:none}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stats div{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px}
.stats b{display:block;font-family:var(--mono);font-size:22px}
.stats small{font-size:11px;color:var(--muted)}
.stats .lime b{color:var(--lime);text-shadow:0 0 14px rgba(198,244,50,.35)}
.split{height:10px;border-radius:99px;overflow:hidden;display:flex;background:var(--empty)}
.split i{height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:11px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend span::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--c)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card h2{font-size:15px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:8px}
.card h2 small{font-family:var(--mono);font-size:12px;color:var(--muted);font-weight:500}
.row{display:flex;align-items:center;gap:10px;padding:0 6px 0 12px;min-height:48px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line)}
.row .n{font-family:var(--mono);color:var(--lime);font-weight:700;width:14px}
.row input[type=text]{flex:1;min-width:0;background:none;border:none;min-height:46px}
.row input[type=text]:focus{outline:none}
.row.done input[type=text]{text-decoration:line-through;color:var(--muted)}
.tick{width:30px;height:30px;border-radius:9px;border:2px solid var(--muted);background:none;flex:none;display:grid;place-items:center;font-weight:800;padding:0}
.tick[aria-pressed="true"]{background:var(--lime);border-color:var(--lime);color:var(--lime-ink)}
/* vue semaine */
.wv{display:grid;grid-template-columns:30px repeat(7,minmax(0,1fr));gap:0}
.wv .hd{text-align:center;padding-bottom:6px;display:flex;flex-direction:column;align-items:center;gap:1px;border:none;background:none;padding-top:0;border-radius:10px}
.wv .hd small{font-size:9.5px;color:var(--muted);text-transform:uppercase}
.wv .hd b{font-family:var(--mono);font-size:14px;width:28px;height:28px;display:grid;place-items:center;border-radius:50%}
.wv .hd.today b{background:var(--lime);color:var(--lime-ink)}
.wv .hrs{position:relative}
.wv .hrs span{position:absolute;right:4px;font-family:var(--mono);font-size:9px;color:var(--muted);transform:translateY(-50%)}
.wv .col{position:relative;border-left:1px solid var(--line)}
.wv .col.today{background:rgba(198,244,50,.04)}
.wv .col .hl{position:absolute;left:0;right:0;border-top:1px dashed var(--line)}
.wv .b{position:absolute;left:2px;right:2px;border-radius:5px;background:color-mix(in srgb,var(--c) 70%,transparent);border:none;padding:0}
.wv .b.done{opacity:.4}
.wv .now{position:absolute;left:-3px;right:0;height:2px;background:var(--lime);box-shadow:0 0 8px var(--lime);z-index:2}
/* jours */
.days{display:flex;flex-direction:column;gap:8px}
details.d{border:1px solid var(--line);border-radius:14px;background:var(--surface-2)}
details.d.today{border-color:var(--lime)}
details.d>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;padding:12px}
details.d>summary::-webkit-details-marker{display:none}
.dl{width:44px;text-align:center;flex:none}
.dl small{display:block;font-size:10.5px;color:var(--muted);text-transform:uppercase}
.dl b{font-family:var(--mono);font-size:20px}
details.d.today .dl b{color:var(--lime)}
.ds{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.ds span{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini{height:4px;border-radius:9px;background:var(--empty);overflow:hidden}.mini i{display:block;height:100%;background:var(--lime)}
.chev{color:var(--lime);font-family:var(--mono);font-size:18px;flex:none;width:20px;text-align:center}
details.d[open] .chev{transform:rotate(90deg)}
.dbody{padding:0 12px 12px;display:flex;flex-direction:column;gap:8px}
.ev{display:flex;align-items:center;gap:10px;padding:8px 6px 8px 10px;border-radius:12px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--c)}
.ev .time{font-family:var(--mono);font-size:11.5px;color:var(--lime);min-width:76px}
.ev .t{flex:1;min-width:0;overflow-wrap:anywhere;font-size:14px}
.ev .t small{display:block;font-size:10.5px;color:var(--c);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.ev.done .t span{text-decoration:line-through;color:var(--muted)}
.x{width:34px;height:34px;border-radius:50%;border:none;background:none;color:var(--muted);flex:none}
.addday{min-height:42px;border-radius:99px;border:1px dashed var(--lime);background:none;color:var(--lime);font-weight:600;font-size:13px}
.empty{color:var(--muted);font-size:13px;margin:0;text-align:center}
.moods{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.moods button{min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);font-family:var(--mono);font-weight:700}
.moods button[aria-pressed="true"]{background:var(--lime);color:var(--lime-ink);border-color:var(--lime)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.field .lbl{font-size:13px;color:var(--muted)}
.field input,.field select,.field textarea{width:100%;min-height:48px;background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.field textarea{min-height:70px;resize:vertical}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.btn{min-height:50px;border-radius:99px;border:none;background:var(--lime);color:var(--lime-ink);font-weight:700;padding:0 18px}
.fab{position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:25;width:62px;height:62px;border-radius:50%;border:none;background:var(--lime);color:var(--lime-ink);box-shadow:0 0 30px rgba(198,244,50,.45);display:grid;place-items:center}
.fab svg{width:28px;height:28px}
.sheet{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.65);display:flex;align-items:flex-end;justify-content:center}
.sheet>form{width:100%;max-width:480px;background:var(--surface);border-radius:24px 24px 0 0;border-top:1px solid var(--lime);max-height:90vh;overflow:auto;
  padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.grab{width:40px;height:4px;border-radius:9px;background:var(--line);align-self:center}
.sheet h2{font-size:20px;font-weight:800;display:flex;justify-content:space-between;align-items:center;gap:8px}
.close{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface-2);flex:none}
.err{font-size:12px;color:var(--late)}.err:empty{display:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--lime);color:var(--lime-ink);padding:8px 16px;border-radius:99px;font-size:13px;font-weight:700}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

    <div class="wsel"><button type="button" data-wk="-1" aria-label="Semaine précédente">‹</button><span id="wLbl"></span><button type="button" data-wk="1" aria-label="Semaine suivante">›</button></div></div>

  <div class="title"><span class="k">Programme</span><h1>Ma <span>semaine</span></h1><p id="wSub"></p><span class="ex" id="exTag">Exemple</span></div>

  <label class="theme"><small>Le thème de ma semaine</small><input id="theme" maxlength="40" placeholder="Ex. Semaine de la discipline"></label>

  <div class="stats">
    <div class="lime"><b id="sLeft">0</b><small>jours restants</small></div>
    <div><b id="sDone">0/0</b><small>activités faites</small></div>
    <div><b id="sHours">0 h</b><small>planifiées</small></div>
  </div>
  <div class="split" id="split" aria-hidden="true"></div>
  <div class="legend" id="legend"></div>

  <div class="card">
    <h2>Mes 3 priorités de la semaine <small id="pCount"></small></h2>
    <div id="prios" style="display:flex;flex-direction:column;gap:8px"></div>
  </div>

  <div class="card" style="padding:14px 10px">
    <h2 style="padding:0 4px">Vue de la semaine <small>06:00 – 22:00</small></h2>
    <div class="wv" id="wv"></div>
  </div>

  <div class="card">
    <h2>Jour par jour</h2>
    <div class="days" id="days"></div>
  </div>

  <div class="card">
    <h2>Bilan de la semaine <small id="bState"></small></h2>
    <div class="field"><span class="lbl">Comment s'est passée ma semaine ?</span><div class="moods" id="moods" role="group" aria-label="Note de 1 à 5"></div></div>
    <div class="field"><label for="bWin">Ma plus belle victoire</label><input id="bWin" maxlength="120"></div>
    <div class="field"><label for="bLearn">Ce que j'ai appris</label><textarea id="bLearn" maxlength="400"></textarea></div>
    <div class="field"><label for="bNext">La semaine prochaine, je change…</label><input id="bNext" maxlength="120"></div>

  </div>

<button class="fab" type="button" id="fab" aria-label="Ajouter une activité"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
<div id="sheetRoot"></div>

<script>
(function(){
  const $=(id)=>document.getElementById(id);
  const pad=(n)=>String(n).padStart(2,'0');
  const esc=(s)=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const uid=()=>Math.random().toString(36).slice(2,9);
  const iso=(d)=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
  const parse=(s)=>new Date(s+'T12:00:00');
  const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
  const monday=(s)=>{const d=parse(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return iso(d)};
  const toMin=(t)=>{const [h,m]=t.split(':').map(Number);return h*60+m};
  const toT=(m)=>pad(Math.floor(m/60))+':'+pad(m%60);
  const fmtDur=(m)=>{const h=Math.floor(m/60),r=m%60;return h?(h+' h'+(r?pad(r):'')):r+' min'};
  const CATS=[['travail','Travail'],['etudes','Études'],['sport','Sport'],['spirituel','Spirituel'],['sante','Santé'],['famille','Famille'],['repos','Repos'],['autre','Autre']];
  const catName=Object.fromEntries(CATS);
  const TODAY=iso(new Date()); const H0=6,H1=22,PX=20;
  let W=monday(TODAY), isExample=true, openDays=new Set([TODAY]);
  const store={};
  const get=(w)=>store[w]||(store[w]={theme:'',prios:[{t:'',d:false},{t:'',d:false},{t:'',d:false}],ev:[],bilan:{mood:0,win:'',learn:'',next:'',saved:false}});
  (function(){ const S=get(W); S.theme='Semaine de la discipline';
    S.prios=[{t:'Finir le rapport du projet',d:false},{t:'3 séances de sport',d:false},{t:'Appeler les parents',d:true}];
    const ex=[[0,'06:00','06:45','Footing','sport'],[0,'08:00','12:00','Travail : rapport','travail'],[0,'14:00','17:00','Réunions','travail'],
      [1,'08:00','12:00','Travail concentré','travail'],[1,'18:00','19:00','Cours en ligne','etudes'],
      [2,'06:00','07:00','Musculation','sport'],[2,'08:00','16:00','Travail','travail'],[2,'20:00','21:00','Appel aux parents','famille'],
      [3,'08:00','12:00','Travail','travail'],[3,'15:00','16:00','Rendez-vous médecin','sante'],[3,'18:00','19:30','Lecture','etudes'],
      [4,'06:00','06:45','Footing','sport'],[4,'08:00','15:00','Travail','travail'],[4,'19:00','21:00','Soirée calme','repos'],
      [5,'09:00','11:00','Marché et courses','autre'],[5,'15:00','18:00','Après-midi en famille','famille'],
      [6,'08:00','10:00','Culte','spirituel'],[6,'17:00','18:00','Préparer la semaine','autre']];
    ex.forEach(([i,s,e,t,c])=>{ const d=addDays(W,i); S.ev.push({id:uid(),date:d,s,e,t,c,done:d<TODAY}); });
  })();
  function toast(t){ const el=document.createElement('div'); el.className='toast'; el.textContent=t; document.body.appendChild(el); setTimeout(()=>el.remove(),1700); }
  function markReal(){ if(isExample){ isExample=false; $('exTag').hidden=true; } }

  function render(){
    const S=get(W), end=addDays(W,6);
    const f=(s,o)=>parse(s).toLocaleDateString('fr-FR',o);
    $('wLbl').textContent=parse(W).getDate()+'–'+f(end,{day:'numeric',month:'short'});
    const wn=(()=>{ const d=parse(W); d.setDate(d.getDate()+3); const y=new Date(d.getFullYear(),0,4); return 1+Math.round(((d-y)/864e5-3+((y.getDay()+6)%7))/7); })();
    $('wSub').textContent='Semaine '+wn+' · du '+f(W,{weekday:'long',day:'numeric',month:'long'})+' au '+f(end,{weekday:'long',day:'numeric',month:'long'});
    $('theme').value=S.theme;
    const left=TODAY<W?7:(TODAY>end?0:7-((parse(TODAY)-parse(W))/864e5));
    $('sLeft').textContent=Math.round(left);
    $('sDone').textContent=S.ev.filter(e=>e.done).length+'/'+S.ev.length;
    const tot=S.ev.reduce((a,e)=>a+toMin(e.e)-toMin(e.s),0); $('sHours').textContent=fmtDur(tot);
    const by={}; S.ev.forEach(e=>by[e.c]=(by[e.c]||0)+toMin(e.e)-toMin(e.s));
    $('split').innerHTML=CATS.filter(([k])=>by[k]).map(([k])=>'<i style="width:'+(by[k]/Math.max(tot,1)*100)+'%;background:var(--c-'+k+')"></i>').join('');
    $('legend').innerHTML=CATS.filter(([k])=>by[k]).map(([k,n])=>'<span style="--c:var(--c-'+k+')">'+n+' '+fmtDur(by[k])+'</span>').join('');
    $('prios').innerHTML=S.prios.map((p,i)=>'<div class="row'+(p.d?' done':'')+'"><span class="n">'+(i+1)+'</span><input type="text" data-prio="'+i+'" maxlength="80" placeholder="Priorité '+(i+1)+'" aria-label="Priorité '+(i+1)+'"><button type="button" class="tick" data-ptick="'+i+'" aria-pressed="'+p.d+'" aria-label="Priorité '+(i+1)+' faite">'+(p.d?'✓':'')+'</button></div>').join('');
    document.querySelectorAll('[data-prio]').forEach((el,i)=>el.value=S.prios[i].t);
    $('pCount').textContent=S.prios.filter(p=>p.d&&p.t).length+'/'+S.prios.filter(p=>p.t).length;
    // vue semaine
    const Hh=(H1-H0)*PX; let v='<span></span>';
    for(let i=0;i<7;i++){ const d=addDays(W,i); v+='<button type="button" class="hd'+(d===TODAY?' today':'')+'" data-open="'+d+'"><small>'+f(d,{weekday:'short'}).replace('.','').slice(0,3)+'</small><b>'+parse(d).getDate()+'</b></button>'; }
    v+='<div class="hrs" style="height:'+Hh+'px">'; for(let h=H0;h<=H1;h+=2) v+='<span style="top:'+((h-H0)*PX)+'px">'+h+'h</span>'; v+='</div>';
    for(let i=0;i<7;i++){ const d=addDays(W,i); v+='<div class="col'+(d===TODAY?' today':'')+'" style="height:'+Hh+'px">';
      for(let h=H0;h<H1;h+=2) v+='<div class="hl" style="top:'+((h-H0)*PX)+'px"></div>';
      S.ev.filter(e=>e.date===d).forEach(e=>{ const s=Math.max(toMin(e.s),H0*60), en=Math.min(toMin(e.e),H1*60); if(en<=s) return;
        v+='<button type="button" class="b'+(e.done?' done':'')+'" data-open="'+d+'" style="--c:var(--c-'+e.c+');top:'+((s-H0*60)/60*PX)+'px;height:'+Math.max(4,(en-s)/60*PX-1)+'px" aria-label="'+esc(e.t)+', '+e.s+' – '+e.e+'"></button>'; });
      if(d===TODAY){ const n=new Date(), m=n.getHours()*60+n.getMinutes(); if(m>=H0*60&&m<=H1*60) v+='<div class="now" style="top:'+((m-H0*60)/60*PX)+'px"></div>'; }
      v+='</div>'; }
    $('wv').innerHTML=v;
    // jours
    let dh='';
    for(let i=0;i<7;i++){ const d=addDays(W,i); const evs=S.ev.filter(e=>e.date===d).sort((a,b)=>a.s.localeCompare(b.s)); const dn=evs.filter(e=>e.done).length;
      dh+='<details class="d'+(d===TODAY?' today':'')+'" data-day="'+d+'"'+(openDays.has(d)?' open':'')+'><summary><div class="dl"><small>'+f(d,{weekday:'short'}).replace('.','')+'</small><b>'+parse(d).getDate()+'</b></div>'
        +'<div class="ds"><span>'+(evs.length?evs.map(e=>esc(e.t)).join(' · '):'Rien de prévu')+'</span>'+(evs.length?'<div class="mini"><i style="width:'+(dn/evs.length*100)+'%"></i></div>':'')+'</div><span class="chev" aria-hidden="true">›</span></summary>'
        +'<div class="dbody">'+(evs.length?evs.map(e=>'<div class="ev'+(e.done?' done':'')+'" style="--c:var(--c-'+e.c+')"><span class="time">'+e.s+' – '+e.e+'</span><div class="t"><small>'+catName[e.c]+'</small><span>'+esc(e.t)+'</span></div>'
          +'<button type="button" class="tick" data-etick="'+e.id+'" aria-pressed="'+e.done+'" aria-label="Activité faite">'+(e.done?'✓':'')+'</button><button type="button" class="x" data-edel="'+e.id+'" aria-label="Supprimer">✕</button></div>').join(''):'<p class="empty">Aucune activité.</p>')
        +'<button type="button" class="addday" data-add="'+d+'">+ Ajouter à ce jour</button></div></details>'; }
    $('days').innerHTML=dh;
    // bilan
    const B=S.bilan;
    $('moods').innerHTML=[1,2,3,4,5].map(n=>'<button type="button" data-mood="'+n+'" aria-pressed="'+(B.mood===n)+'">'+n+'</button>').join('');
    $('bWin').value=B.win; $('bLearn').value=B.learn; $('bNext').value=B.next; $('bState').textContent=B.saved?'enregistré':'';
  }

  function openSheet(date){
    const d=date||(TODAY>=W&&TODAY<=addDays(W,6)?TODAY:W);
    const opts=Array.from({length:7},(_,i)=>{ const x=addDays(W,i); return '<option value="'+x+'"'+(x===d?' selected':'')+'>'+parse(x).toLocaleDateString('fr-FR',{weekday:'long',day:'numeric'})+'</option>'; }).join('');
    $('sheetRoot').innerHTML='<div class="sheet" id="sheet"><form id="sf" role="dialog" aria-modal="true" aria-label="Nouvelle activité" novalidate><span class="grab"></span>'
      +'<h2>Nouvelle activité<button type="button" class="close" data-close="1" aria-label="Fermer">✕</button></h2>'
      +'<div class="field"><label for="fT">Activité</label><input id="fT" maxlength="80" placeholder="Ex. Séance de natation"><span class="err" id="fTErr"></span></div>'
      +'<div class="grid2"><div class="field"><label for="fD">Jour</label><select id="fD">'+opts+'</select></div><div class="field"><label for="fC">Catégorie</label><select id="fC">'+CATS.map(([k,n])=>'<option value="'+k+'">'+n+'</option>').join('')+'</select></div></div>'
      +'<div class="grid2"><div class="field"><label for="fS">Début</label><input id="fS" type="time" value="09:00"></div><div class="field"><label for="fE">Fin</label><input id="fE" type="time" value="10:00"></div></div>'
      +'<span class="err" id="fSErr"></span>'
      +'<label class="field"><span class="lbl" style="font-size:13px;color:var(--muted)">Répéter</span><select id="fR"><option value="0">Une seule fois</option><option value="1">Tous les jours de la semaine</option><option value="2">Du lundi au vendredi</option></select></label>'
      +'<button class="btn" type="submit">Ajouter à ma semaine</button></form></div>';
    setTimeout(()=>$('fT').focus(),50);
  }
  const closeSheet=()=>{ $('sheetRoot').innerHTML=''; };

  document.addEventListener('toggle',(e)=>{ const d=e.target; if(d.classList&&d.classList.contains('d')){ if(d.open) openDays.add(d.dataset.day); else openDays.delete(d.dataset.day); } },true);
  document.addEventListener('click',(e)=>{
    if(e.target.id==='sheet'){ closeSheet(); return; }
    const b=e.target.closest('button'); if(!b) return; const ds=b.dataset; const S=get(W);
    if(ds.wk){ W=addDays(W,7*Number(ds.wk)); openDays=new Set([TODAY]); render(); return; }
    if(ds.open){ openDays.add(ds.open); render(); const el=document.querySelector('details[data-day="'+ds.open+'"]'); if(el) el.scrollIntoView({block:'center'}); return; }
    if(ds.add){ openSheet(ds.add); return; }
    if(b.id==='fab'){ openSheet(); return; }
    if(ds.close){ closeSheet(); return; }
    if(ds.ptick){ const p=S.prios[Number(ds.ptick)]; if(!p.t){ document.querySelector('[data-prio="'+ds.ptick+'"]').focus(); return; } p.d=!p.d; markReal(); render(); return; }
    if(ds.etick){ const ev=S.ev.find(x=>x.id===ds.etick); ev.done=!ev.done; markReal(); render(); if(ev.done) toast('Bravo, c\'est fait'); return; }
    if(ds.edel){ S.ev=S.ev.filter(x=>x.id!==ds.edel); markReal(); render(); toast('Activité supprimée'); return; }
    if(ds.mood){ S.bilan.mood=Number(ds.mood); markReal(); document.querySelectorAll('[data-mood]').forEach(x=>x.setAttribute('aria-pressed',String(x===b))); return; }
    if(b.id==='bSave'){ Object.assign(S.bilan,{win:$('bWin').value.trim(),learn:$('bLearn').value.trim(),next:$('bNext').value.trim(),saved:true}); markReal(); $('bState').textContent='enregistré'; toast('Bilan enregistré'); return; }
  });
  document.addEventListener('input',(e)=>{ const S=get(W), t=e.target;
    if(t.id==='theme'){ S.theme=t.value; markReal(); }
    if(t.dataset.prio!=null){ S.prios[Number(t.dataset.prio)].t=t.value; markReal(); $('pCount').textContent=S.prios.filter(p=>p.d&&p.t).length+'/'+S.prios.filter(p=>p.t).length; }
  });
  document.addEventListener('submit',(e)=>{ if(e.target.id!=='sf') return; e.preventDefault(); const S=get(W);
    $('fTErr').textContent=''; $('fSErr').textContent='';
    const t=$('fT').value.trim(), s=$('fS').value, en=$('fE').value; let ok=true;
    if(!t){ $('fTErr').textContent='Donne un nom à cette activité.'; ok=false; }
    if(!s||!en||toMin(en)<=toMin(s)){ $('fSErr').textContent='L\'heure de fin doit être après le début.'; ok=false; }
    if(!ok) return;
    const r=$('fR').value; const dates=r==='0'?[$('fD').value]:Array.from({length:r==='1'?7:5},(_,i)=>addDays(W,i));
    dates.forEach(d=>{ S.ev.push({id:uid(),date:d,s,e:en,t,c:$('fC').value,done:false}); openDays.add(d); });
    closeSheet(); markReal(); render(); toast(dates.length>1?'Ajouté sur '+dates.length+' jours':'Ajouté à ta semaine');
  });
  document.addEventListener('keydown',(e)=>{ if(e.key==='Escape'&&$('sheet')) closeSheet(); });
  render();
})();
</script>

</body></html>
